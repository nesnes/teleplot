# Builds and tests Teleplot V2 (packages/), and packages it for third parties:
#   teleplot-js.js       the library alone, one file with its dependencies inside
#   teleplot-webapp.zip  the GUI, static files with the library inside: unzip and serve
#   teleplot-server.zip  the server (UDP to WebSocket relay) with the GUI inside: npm ci && node main.js
#   teleplot-<os>-<arch>  the same server as one executable, nothing to install (Linux, macOS, Windows)
# Every run keeps them as a workflow artifact; pushing a tag "v2..." also publishes them
# as a GitHub release (a pre-release when the tag has a suffix, ex: v2.0.0-beta.1).

name: Teleplot V2

on:
  push:
    branches: [ "teleplot2" ]
    tags: [ "v2*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The C++ client (clients/cpp/Teleplot.h) on the three systems it supports: its own tests, and what it sends read back by the library
  cpp:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install libjpeg's tools (the reference the JPEG encoder of TeleplotImage.h is compared with)
        if: runner.os != 'Windows'
        run: if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y libjpeg-turbo-progs; else brew install jpeg-turbo; fi
      - name: Test the C++ client (g++ / clang)
        if: runner.os != 'Windows'
        run: sh clients/cpp/test.sh
      - name: Test the C++ client (MSVC)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: clients/cpp
        run: |
          cmake -S . -B build
          cmake --build build --config Release
          ./build/Release/teleplot_test_client.exe
          ./build/Release/teleplot_test_scenarios.exe build
          mkdir -p build/images
          ./build/Release/teleplot_test_image.exe build/images
          mkdir -p build/examples
          for example in examples/*.cpp; do
            name=$(basename "$example" .cpp)
            (cd build/examples && python ../../../tools/capture_udp.py 1.5 "$name" "../Release/example_$name.exe")
          done
          TELEPLOT_CPP_OUT="$PWD/build" node tests/run.js

  # The microcontroller library (clients/arduino/Teleplot): its tests on a computer (with the C++ client: one API), and its examples
  # built for real boards (AVR, ESP32) by the official Arduino action
  arduino:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Test the microcontroller library
        run: sh clients/arduino/Teleplot/test.sh
      - name: "Build the examples for an Uno (not the ESP32 ones: 21, 30) and an ESP32 (all)"
        uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:uno
          libraries: |
            - source-path: clients/arduino/Teleplot
            - name: SD
          sketch-paths: |
            - clients/arduino/Teleplot/examples/01_FirstValue
            - clients/arduino/Teleplot/examples/02_Describe
            - clients/arduino/Teleplot/examples/03_Together
            - clients/arduino/Teleplot/examples/04_Logs
            - clients/arduino/Teleplot/examples/05_States
            - clients/arduino/Teleplot/examples/06_WhatRuns
            - clients/arduino/Teleplot/examples/07_MapPosition
            - clients/arduino/Teleplot/examples/08_MovingShape
            - clients/arduino/Teleplot/examples/09_Drawings
            - clients/arduino/Teleplot/examples/10_Scene3D
            - clients/arduino/Teleplot/examples/11_Looks
            - clients/arduino/Teleplot/examples/12_Lidar
            - clients/arduino/Teleplot/examples/13_Picture
            - clients/arduino/Teleplot/examples/14_Camera
            - clients/arduino/Teleplot/examples/15_DepthMap
            - clients/arduino/Teleplot/examples/16_Settings
            - clients/arduino/Teleplot/examples/17_Buttons
            - clients/arduino/Teleplot/examples/18_Joystick
            - clients/arduino/Teleplot/examples/19_SettingRules
            - clients/arduino/Teleplot/examples/20_TimeAndRate
            - clients/arduino/Teleplot/examples/22_Recording
            - clients/arduino/Teleplot/examples/23_Dashboard
            - clients/arduino/Teleplot/examples/24_Stats
            - clients/arduino/Teleplot/examples/31_SmallBoards
          cli-compile-flags: |
            - --warnings
            - all
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - source-path: clients/arduino/Teleplot
            - name: SD
          sketch-paths: |
            - clients/arduino/Teleplot/examples

  # The Python client (clients/python/teleplot.py): its own tests, and what it sends read back by the library and compared with the C++
  # client and the Arduino library; Python 3.9 with nothing else, and the latest with NumPy and Pillow (the paths that use them)
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            extras: ""
          - python: "3.13"
            extras: "numpy pillow"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: "Optional packages: ${{ matrix.extras || 'none' }}"
        if: matrix.extras != ''
        run: python -m pip install ${{ matrix.extras }}
      - name: Test the Python client
        run: PYTHON=python sh clients/python/test.sh

  # The Bash examples (clients/bash): each one run for a moment, what it sends read back by the library
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Test the Bash examples
        run: sh clients/bash/test.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build the library
        working-directory: packages/teleplot-js
        run: bash build.sh

      - name: Test the library
        run: sh packages/teleplot-js/test.sh

      - name: Test the webapp
        run: sh packages/webapp/test.sh

      - name: Test the server
        run: |
          (cd packages/server && npm ci --no-audit --no-fund)
          sh packages/server/test.sh

      - name: Package
        run: |
          mkdir -p dist/teleplot-webapp
          cp packages/teleplot-js/teleplot-js.js dist/
          cp -r packages/webapp/. dist/teleplot-webapp/
          rm -rf dist/teleplot-webapp/tests dist/teleplot-webapp/test.sh
          cp LICENSE.txt dist/teleplot-webapp/
          echo "${GITHUB_REF_NAME} (${GITHUB_SHA})" > dist/teleplot-webapp/VERSION
          mkdir dist/teleplot-server
          cp packages/server/main.js packages/server/package.json packages/server/package-lock.json LICENSE.txt dist/teleplot-server/
          cp -r dist/teleplot-webapp dist/teleplot-server/www
          (cd dist && zip -qr teleplot-webapp.zip teleplot-webapp && zip -qr teleplot-server.zip teleplot-server && rm -r teleplot-webapp teleplot-server)
          ls -l dist

      - uses: actions/upload-artifact@v6
        with:
          name: teleplot-v2
          path: dist/
          if-no-files-found: error

  # On macOS because the Apple silicon executable must be signed (ad hoc), which pkg does there.
  # The others are cross-built: the script is embedded as is (no bytecode), nothing of the target runs.
  executables:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: teleplot-v2
          path: dist
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build the executables
        run: |
          unzip -q dist/teleplot-server.zip
          cd teleplot-server
          npm ci --omit=dev --no-audit --no-fund
          npm run make
          ls -l build

      - uses: actions/upload-artifact@v6
        with:
          name: teleplot-v2-executables
          path: teleplot-server/build/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ build, executables ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: teleplot-v2*
          merge-multiple: true
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          cat > notes.md <<'EOF'
          **Executables** (`teleplot-<os>-<arch>`): the server and the web application in one file, nothing to install. Run it, open http://127.0.0.1:8080 and send UDP packets to port 47269.

          They are not signed with a paid certificate, so the system asks before running one downloaded with a browser:
          - Linux and macOS: `chmod +x teleplot-macos-arm64`
          - macOS "could not verify": close the dialog, then `xattr -d com.apple.quarantine teleplot-macos-arm64`
          - Windows SmartScreen: "More info", then "Run anyway"

          **Other files**: `teleplot-server.zip` (the same as sources: `npm ci && node main.js`), `teleplot-webapp.zip` (the web application alone, static files), `teleplot-js.js` (the library alone).
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Teleplot $GITHUB_REF_NAME" --notes-file notes.md --generate-notes $flags
