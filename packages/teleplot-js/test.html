<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teleplot JS Test page</title>
  <script src="teleplot-js.js"></script>
  <style>
    /* Page only: the views are styled by the library (and follow its theme variables, like this page) */
    body { margin: 0; background: var(--teleplot-bg); color: var(--teleplot-text); font: 14px/1.45 system-ui, sans-serif; }
    header { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--teleplot-surface); border-bottom: 1px solid var(--teleplot-line); }
    header h1 { margin: 0 auto 0 0; font-size: 16px; }
    header button, header a { font: inherit; color: inherit; padding: 3px 10px; border: 1px solid var(--teleplot-line); border-radius: 6px; background: none; cursor: pointer; text-decoration: none; }
    .page { display: grid; grid-template-columns: 210px minmax(0, 1fr); }
    nav { position: sticky; top: 46px; align-self: start; max-height: calc(100vh - 46px); overflow: auto; padding: 12px 8px; box-sizing: border-box; }
    nav a { display: flex; justify-content: space-between; padding: 4px 10px; border-radius: 6px; color: var(--teleplot-muted); text-decoration: none; }
    nav a:hover, nav a.active { color: var(--teleplot-text); background: color-mix(in srgb, var(--teleplot-text) 8%, transparent); }
    main { padding: 0 20px 60vh 12px; min-width: 0; }
    section { scroll-margin-top: 54px; }
    h2 { margin: 28px 0 4px; font-size: 20px; }
    .intro { margin: 0 0 12px; max-width: 75em; color: var(--teleplot-muted); }
    .demo { margin: 0 0 14px; padding: 10px 12px; border: 1px solid var(--teleplot-line); border-radius: 10px; }
    .demo h3 { margin: 0; font-size: 14px; }
    .demo .note { margin: 2px 0 8px; color: var(--teleplot-muted); }
    .demo-body { display: flex; gap: 12px; align-items: flex-start; }
    .demo-body.wide { flex-direction: column; }
    /* The box of a demo: the view fills it. A view has a minimum height of its own (from its layout height): when a demo asks for a precise
       size (to test small and short views) that minimum is lifted so the view really has that size; otherwise the box grows with the view. */
    .demo-view { flex: none; max-width: 100%; display: grid; }
    .demo-view > div { min-width: 0; min-height: 0; }
    .demo-view.exact .teleplot-js-telemetry-card { min-height: 0 !important; }
    pre { flex: 1 1 0; min-width: 0; max-height: 24em; margin: 0; padding: 8px 10px; overflow: auto; box-sizing: border-box; border-radius: 6px; font: 12px/1.45 var(--teleplot-mono);
          background: var(--teleplot-surface); border: 1px solid var(--teleplot-line); white-space: pre; scrollbar-width: thin; }
    .wide > pre, details > pre { flex: none; width: 100%; }
    details summary { cursor: pointer; color: var(--teleplot-muted); }
    details[open] summary { margin-bottom: 6px; }
    @media (max-width: 900px) { .page { grid-template-columns: 1fr; } nav { display: none; } .demo-body { flex-direction: column; } pre { flex: none; width: 100%; } }
  </style>
</head>
<body>
  <header>
    <h1>Teleplot JS: every feature of the library, live</h1>
    <button onclick="Teleplot.setReceiving(!Teleplot.state.receiving)">Stop / start receiving</button>
    <button onclick="document.documentElement.dataset.theme = Teleplot.theme.isDark() ? 'light' : 'dark'">Light / Dark</button>
    <a href="test-performance.html">Performance test page</a>
  </header>
  <div class="page"><nav id="index"></nav><main id="main"></main></div>

  <script>
    initTeleplot();
    console.log("Teleplot loaded:", Teleplot);
    const P = Teleplot.protocol; // Protocol constants (data types, attributes...)

    // ------------------------------------------------------------------ The page: sections, an index, and cards
    // demo(title, what to look for, [width, height], build): a card with a live view and, next to it, the code that built it (the "build"
    // function itself, so the code shown is the code that runs). build gets the id of the element to draw in.
    // A size in pixels is exact (the view is given that box, whatever its own minimum height); with a width in % the height is a minimum.
    // data(title, note, send): a card for the code that produces the telemetries of a section (run once, shown folded).
    const main = document.getElementById("main"), index = document.getElementById("index");
    const add = (tag, props, parent) => parent.appendChild(Object.assign(document.createElement(tag), props));
    const px = (v) => typeof v == "number" ? v + "px" : v;
    let current, count = 0;
    function section(title, intro) {
      const id = "s-" + title.toLowerCase().replace(/[^a-z0-9]+/g, "-");
      current = add("section", { id }, main);
      add("h2", { textContent: title }, current);
      if (intro) add("p", { className: "intro", textContent: intro }, current);
      current.link = add("a", { href: "#" + id, textContent: title }, index);
      current.counter = add("span", {}, current.link); // Number of demos, written when there is one
      spy.observe(current);
    }
    function source(fn) { // Body of a function as written, without its first indentation
      const text = fn.toString();
      if (!text.includes("\n")) return text.replace(/^[^=]*=>\s*/, "");
      const lines = text.split("\n").slice(1, -1), indent = Math.min(...lines.filter((l) => l.trim()).map((l) => l.match(/^ */)[0].length));
      return lines.map((l) => l.slice(indent)).join("\n");
    }
    function card(title, note) {
      const article = add("article", { className: "demo" }, current);
      add("h3", { textContent: title }, article);
      if (note) add("p", { className: "note", textContent: note }, article);
      return article;
    }
    function demo(title, note, [width, height], build) {
      const body = add("div", { className: "demo-body" + (String(width).endsWith("%") ? " wide" : "") }, card(title, note));
      const exact = typeof width == "number" && typeof height == "number";
      const box = add("div", { className: "demo-view" + (exact ? " exact" : "") }, body);
      box.style.width = px(width); box.style[exact ? "height" : "minHeight"] = px(height);
      const view = add("div", { id: "demo-" + (++count) }, box);
      add("pre", { textContent: source(build) }, body);
      current.counter.textContent = Number(current.counter.textContent || 0) + 1;
      try { build(view.id); } catch (e) { console.error("Demo failed:", title, e); view.textContent = "This demo failed: " + e.message; }
    }
    function data(title, note, send) {
      const details = add("details", {}, card(title, note));
      add("summary", { textContent: "Code" }, details);
      add("pre", { textContent: source(send) }, details);
      send();
    }
    // The index shows which section is on screen
    const spy = new IntersectionObserver((entries) => entries.forEach((e) => e.target.link.classList.toggle("active", e.isIntersecting)), { rootMargin: "-50px 0px -60% 0px" });

    // ====================================================================================================================== Data
    section("Data", "The telemetries most demos display. Each section adds its own when it needs more. Everything goes through the public API: Teleplot.datastore, or the parsers Teleplot.parseDataText / Teleplot.parseDataBinary.");

    data("Numbers, text, 2D, 3D, images, a telemetry without data", "numberTelemetry and number.cos are updated 100 times per second, img1 changes every 2 seconds.", () => {
      const now = () => Date.now() / 1000;
      Teleplot.datastore.addTelemetry("text.Telemetry").addData(P.SECTION_TYPE_TELEM_DATA_TEXT, [now(), now() + 0.5, now() + 1], [["one", "two", "hello world, nice to meet you how are you"]]);
      Teleplot.datastore.addTelemetry(longName).addData(P.SECTION_TYPE_TELEM_DATA_NUMBER_2D, [now()], [[42], [43]]);
      Teleplot.datastore.addTelemetry("pose.3D").addData(P.SECTION_TYPE_TELEM_DATA_NUMBER_3D, [now()], [[1.23456], [-2.5], [1000]]);
      Teleplot.datastore.addTelemetry("empty.telemetry"); // Created, but no data yet
      const longUnit = Teleplot.datastore.addTelemetry("long.unit");
      longUnit.setAttribute(P.TELEM_ATTR_UNIT, "W/(m2.K) per square meter of surface");
      longUnit.addData(P.SECTION_TYPE_TELEM_DATA_NUMBER, [now()], [[12345.6789]]);

      // Images, through the text protocol
      Teleplot.parseDataText(`JPG|img1:${Date.now()}:1/1:${imgJpg}`);
      let imageCount = 0;
      setInterval(() => Teleplot.parseDataText(`${imageCount++ % 2 ? "JPG" : "PNG"}|img1:${Date.now()}:1/1:${imageCount % 2 ? imgPng : imgJpg}`), 2000);

      // One telemetry with several kinds of data (very specific, probably shouldn't be supported)
      const multi = Teleplot.datastore.addTelemetry("multi-channel-telemetry");
      multi.addData(P.SECTION_TYPE_TELEM_DATA_NUMBER, [now()], [[42]]);
      multi.addData(P.SECTION_TYPE_TELEM_DATA_TEXT, [now()], [["coucou"]]);
      Teleplot.parseDataText(`JPG|multi-channel-telemetry:${Date.now()}:1/1:${imgJpg}`);

      // Live numbers
      Teleplot.datastore.addTelemetry("numberTelemetry").addData(P.SECTION_TYPE_TELEM_DATA_NUMBER, [now()], [[42]]);
      Teleplot.datastore.addTelemetry("number.cos").addData(P.SECTION_TYPE_TELEM_DATA_NUMBER, [now()], [[42]]);
      Teleplot.datastore.getTelemetry("number.cos").setAttribute(P.TELEM_ATTR_DATA_TIMEOUT, 5.0); // Its own timeout: only 5 seconds are kept
      let updates = 0;
      setInterval(() => {
        Teleplot.datastore.getTelemetry("numberTelemetry").addData(P.SECTION_TYPE_TELEM_DATA_NUMBER, [now()], [[Math.sin(now()) * 100]]);
        Teleplot.datastore.getTelemetry("number.cos").addData(P.SECTION_TYPE_TELEM_DATA_NUMBER, [now()], [[Math.cos(now()) * 100]]);
        multi.addData(P.SECTION_TYPE_TELEM_DATA_NUMBER, [now()], [[updates++]]);
      }, 10);
    });

    demo("Memory: what the data takes, and making room", "The library estimates the room its data takes, per telemetry. When TELEPLOT.state.memoryLimit is reached it thins out the oldest data by itself (or forgets it, or pauses: memoryPolicy); the buttons do it by hand on numberTelemetry. Thinning keeps real samples (the lowest and highest of each group of 4), fewer of them: watch the chart on the right get a tinted \"thinned\" part.", [760, 220], (id) => {
      const box = document.getElementById(id);
      box.style.cssText += "display: grid; grid-template-columns: 320px 1fr; gap: 12px;";
      box.innerHTML = '<div><button>Thin out the oldest half</button> <button>Forget the oldest quarter</button> <button>Clear</button><pre style="margin-top: 8px; height: 150px"></pre></div><div id="' + id + '-chart"></div>';
      const [thin, forget, clear] = box.querySelectorAll("button"), out = box.querySelector("pre");
      const telem = Teleplot.datastore.getTelemetry("numberTelemetry");
      thin.onclick = () => telem.thinOldest(0.5);
      forget.onclick = () => telem.forgetOldest(0.25);
      clear.onclick = () => telem.clearData();
      Teleplot.view.addView(new Teleplot.view.ViewChart(id + "-chart", ["numberTelemetry"]));
      setInterval(() => {
        const usage = Teleplot.datastore.getMemoryUsage(), own = telem.getMemoryUsage(), span = Teleplot.datastore.getTimeSpan(); // (checkMemory() also runs once per second, in the update loop)
        out.textContent = `all the data: ${Math.round(usage.bytes / 1000)} kB, ${usage.samples} samples\nlimit: ${Teleplot.state.memoryLimit / 1e6} MB, policy: ${Teleplot.state.memoryPolicy}\nheaviest: ${usage.telemetries.slice(0, 3).map((t) => t.name).join(", ")}\ngoes back ${span ? Math.round(span.duration) : 0} s of the ${Teleplot.state.dataTimeout} s kept (${span ? span.name : "no data"})${span && span.thinned.length ? ", intact for the last " + Math.round(span.intact) + " s (thinned: " + span.thinned.join(", ") + ")" : ""}\n\nnumberTelemetry: ${Math.round(own.bytes / 1000)} kB, ${own.samples} samples`;
      }, 500);
    });

    section("Timelines, marks, ranges and thresholds", "Text over time: a ViewTimeline draws states as bands and logs as ticks, a chart draws text telemetries as marks. Numbers can say what they are expected between (a range: an attribute) and which limits they should not pass (thresholds: data, so they can change over time). Nothing is made up: bands start and end on samples, limits are steps. See doc/time-views.md.");

    data("States, a zone with holes, a number with a range and thresholds", "tl.mode changes every second or so (sent again 10 times per second: the same text continues its band), tl.zone is \"dock\" or nothing (an empty text), tl.fast changes 200 times per second during one second out of ten. tl.temp has a range (ATTR line), two fixed thresholds and one (hot) that moves every 6 seconds (TH lines). tl.battery gets the same things through the binary protocol.", () => {
      const modes = ["idle", "moving", "moving", "grasping", "moving", "idle", "error: gripper stalled", "idle", "charging"];
      let mode = 0, until = 0, hot = 70;
      Teleplot.parseDataText("ATTR|tl.temp|min=0|max=100\nTH|tl.temp:cold<15,#3498db:hot>70:critical>90,#e74c3c");
      setInterval(() => {
        const now = Date.now() / 1000;
        if (now > until) { mode = (mode + 1) % modes.length; until = now + 0.8 + Math.random() * 2.5; }
        Teleplot.parseDataText(`tl.mode:${modes[mode]}|t`);
        Teleplot.parseDataText(`tl.zone:${Math.floor(now / 4) % 3 == 0 ? "dock" : ""}|t`);
        Teleplot.parseDataText(`tl.temp:${(55 + 40 * Math.sin(now / 5) + 3 * Math.sin(now * 3)).toFixed(2)}§°C`);
        const moved = 70 + 8 * (Math.floor(now / 6) % 3);
        if (moved != hot) { hot = moved; Teleplot.parseDataText(`TH|tl.temp:hot>${hot}`); } // from now on: what was drawn keeps the limit it had
      }, 100);
      setInterval(() => { // A state too fast to be drawn, one second out of ten
        const now = Date.now() / 1000;
        if (Math.floor(now) % 10 == 0) Teleplot.parseDataText("tl.fast:" + Array.from({ length: 4 }, (v, i) => Math.round(now * 1000 + i * 5) + ":s" + (Math.round(now * 200) + i) % 3).join(";") + "|t");
        else Teleplot.parseDataText("tl.fast:steady|t");
      }, 20);

      // The same through the binary protocol: a range attribute (9) and a threshold section (40), see doc/binaryProtocol.md
      const bytes = [];
      const u8 = (v) => bytes.push(v & 0xff), u16 = (v) => { u8(v); u8(v >> 8); }, u32 = (v) => { u16(v & 0xffff); u16(Math.floor(v / 65536)); };
      const u64 = (v) => { u32(Number(v & 0xffffffffn)); u32(Number(v >> 32n)); };
      const f32 = (v) => bytes.push(...new Uint8Array(new Float32Array([v]).buffer)), f64 = (v) => bytes.push(...new Uint8Array(new Float64Array([v]).buffer));
      const str = (text) => bytes.push(...new TextEncoder().encode(text), 0);
      const packet = (write) => { bytes.length = 0; u8(P.BINARY_MARKER); u8(P.BINARY_VERSION); u16(12); write(); u16(0); Teleplot.parseDataBinary(Uint8Array.from(bytes).buffer); };
      window.tlBattery = 12 * 0x10000 + 1; // (client 12, telemetry 1)
      packet(() => {
        u8(P.SECTION_TYPE_TELEM_ATTR); u16(1); u8(3); u8(P.TELEM_ATTR_NAME); str("tl.battery"); u8(P.TELEM_ATTR_UNIT); str("V"); u8(P.TELEM_ATTR_RANGE); f64(9); f64(12.6);
        u8(P.SECTION_TYPE_TELEM_DATA_THRESHOLD); u16(1); u64(BigInt(Date.now()) * 1000000n); u8(2);
        u32(0); u8(P.THRESHOLD_BELOW); f64(10.5); str("low"); str("");
        u32(0); u8(P.THRESHOLD_BELOW); f64(9.9); str("empty"); str("#e74c3c");
      });
      setInterval(() => packet(() => { u8(P.SECTION_TYPE_TELEM_DATA_NUMBER); u16(1); u64(BigInt(Date.now()) * 1000000n); u8(1); u32(0); f32(11 + 1.6 * Math.sin(Date.now() / 7000)); }), 200);
    });

      setInterval(() => { // loop > job > step (> sub step), then nothing for a moment

    section("Graphs: state machines and behavior trees", "A state or a stack with a structure (doc/graph.md): an enum sample gives its nodes (paths, a slash between levels, an optional #kind), an edges sample its transitions (from>to=event). Samples with the same time are parts of one structure; a newer time is a whole new one. What runs is the text of the telemetry: a stack can hold several paths at once, each with a status (path=failure). ViewGraph draws the structure in force at the time shown and what runs in it; the timeline draws the same stack by branches.");

    data("A state machine, a behavior tree, parallel states", "g.mode moves through idle, mission/goto, mission/grasp, sometimes dock or error, every 1.5 s or so, with its edges. g.bt ticks 4 times per second: a fallback over a sequence (a battery check, then go to the waypoint) and dock; the check fails one tick in six, so the sequence fails and the fallback docks. g.par runs two regions at once (nav and arm), without a structure.", () => {
      const now = () => (performance.timeOrigin + performance.now()).toFixed(3);
      Teleplot.parseDataText([
        "g.mode:1000:idle,mission/goto,mission/grasp,dock,error|enum",
        "g.mode:1000:idle>mission=start,mission/goto>mission/grasp=arrived,mission/grasp>idle=done,mission>dock=battery low,dock>idle=charged|edges",
        "g.mode:1000:mission>error=fault,dock>error=fault,error>idle=reset|edges",
        "g.bt:1000:root#fallback,root/patrol#sequence,root/patrol/battery_ok#condition,root/patrol/goto#action,root/dock#action|enum",
      ].join("\n"));
      const steps = { idle: [["mission/goto", 1]], "mission/goto": [["mission/grasp", 0.8], ["dock", 0.1], ["error", 0.1]], "mission/grasp": [["idle", 0.85], ["error", 0.15]], dock: [["idle", 1]], error: [["idle", 1]] };
      let mode = "idle";
      Teleplot.parseDataText(`g.mode:${now()}:${mode}|stack`);
      setInterval(() => {
        let r = Math.random(), next = steps[mode].find(([, p]) => (r -= p) < 0) || steps[mode][0];
        mode = next[0];
        Teleplot.parseDataText(`g.mode:${now()}:${mode}|stack`);
      }, 1500);
      let tick = 0;
      setInterval(() => {
        tick++;
        const fail = tick % 6 == 0;
        Teleplot.parseDataText(`g.bt:${now()}:` + (fail ? "root/patrol/battery_ok=failure,root/patrol=failure,root/dock" : "root/patrol/battery_ok=success,root/patrol/goto") + "|stack");
      }, 250);
      let nav = "follow", arm = "idle";
      setInterval(() => {
        if (Math.random() < 0.5) nav = nav == "follow" ? "avoid" : "follow"; else arm = arm == "idle" ? "reach" : "idle";
        Teleplot.parseDataText(`g.par:${now()}:nav/${nav},arm/${arm}|stack`);
      }, 1100);
    });

    data("Shapes with the binary protocol", "Packet builds binary packets (little-endian, see doc/binaryProtocol.md); binId(n) is the id the datastore gives to telemetry n of this client. One packet holds attributes and every kind of shape data.", () => {
      window.Packet = class Packet {
        constructor(clientId) { this.bytes = [P.BINARY_MARKER, P.BINARY_VERSION]; this.u16(clientId); this.ns = BigInt(Date.now()) * 1000000n; }
        u8(v) { this.bytes.push(v & 0xff); return this; }
        u16(v) { return this.u8(v).u8(v >> 8); }
        u32(v) { return this.u16(v & 0xffff).u16(Math.floor(v / 65536)); }
        u64(v) { v = BigInt(v); return this.u32(Number(v & 0xffffffffn)).u32(Number(v >> 32n)); }
        f32(v) { this.bytes.push(...new Uint8Array(new Float32Array([v]).buffer)); return this; }
        str(s) { this.bytes.push(...new TextEncoder().encode(s), 0); return this; }
        section(type, telemId, write) { this.u8(type).u16(telemId).u64(this.ns).u8(1).u32(0); write(this); return this; } // one sample, at the time of the packet (the parts of a picture must share it)
        send() { Teleplot.parseDataBinary(Uint8Array.from([...this.bytes, 0, 0]).buffer); }
      };
      window.CLIENT = 7;
      window.binId = (telemId) => CLIENT * 0x10000 + telemId;

      new Packet(CLIENT)
        .u8(P.SECTION_TYPE_CLIENT_NAME).str("3D demo (binary)")
        .u8(P.SECTION_TYPE_TELEM_ATTR).u16(1).u8(2).u8(P.TELEM_ATTR_NAME).str("bin3d.body").u8(P.TELEM_ATTR_SHAPE).u8(P.TELEM_ATTR_SHAPE_TYPE_CUBE)
        .u8(P.SECTION_TYPE_TELEM_ATTR).u16(2).u8(2).u8(P.TELEM_ATTR_NAME).str("bin3d.beacon").u8(P.TELEM_ATTR_SHAPE).u8(P.TELEM_ATTR_SHAPE_TYPE_SPHERE)
        .u8(P.SECTION_TYPE_TELEM_ATTR).u16(3).u8(2).u8(P.TELEM_ATTR_NAME).str("bin3d.mast").u8(P.TELEM_ATTR_SHAPE).u8(P.TELEM_ATTR_SHAPE_TYPE_CYLINDER)
        .u8(P.SECTION_TYPE_TELEM_ATTR).u16(4).u8(1).u8(P.TELEM_ATTR_NAME).str("bin3d.antenna.tip")
        .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_SIZE, 1, (p) => p.f32(0.8).f32(0.5).f32(0.3))
        .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_COLOR_STR, 1, (p) => p.str("#e67e22"))
        .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_SIZE, 2, (p) => p.f32(0.3).f32(0.3).f32(0.3))
        .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_SIZE, 3, (p) => p.f32(0.05).f32(0.05).f32(1))
        .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_3D_POSITION, 3, (p) => p.f32(0).f32(0).f32(0.5))
        .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_3D_ROTATION, 3, (p) => p.f32(0).f32(0.3).f32(0)) // roll, pitch, yaw: leans forward
        .send();
      setInterval(() => {
        const t = Date.now() / 1000, yaw = t / 2 + Math.PI / 2; // drives on a circle, facing where it goes
        const x = 1.5 * Math.cos(t / 2), y = 1.5 * Math.sin(t / 2);
        new Packet(CLIENT)
          .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_3D_POSITION, 1, (p) => p.f32(x).f32(y).f32(0.15))
          .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_3D_QUATERNION, 1, (p) => p.f32(Math.cos(yaw / 2)).f32(0).f32(0).f32(Math.sin(yaw / 2))) // w, x, y, z
          .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_3D_POSITION, 2, (p) => p.f32(0).f32(0).f32(1.15))
          .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_COLOR_RGB, 2, (p) => p.u8(255).u8(Math.round(127 + 127 * Math.sin(t * 3))).u8(0))
          .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_OPACITY, 2, (p) => p.u8(Math.round(155 + 100 * Math.sin(t * 3))))
          .section(P.SECTION_TYPE_TELEM_DATA_NUMBER_3D, 4, (p) => p.f32(x).f32(y).f32(0.5 + 0.2 * Math.sin(t * 4)))
          .send();
      }, 50);
    });

    data("Point clouds (lidar scans...)", "A sample of a point cloud telemetry is a whole cloud. Text: name:x:y:z;x:y:z|pc (a field alone first is the timestamp; x:y:z:i adds an intensity, x:y:z:r:g:b a color, x:y:z:i:r:g:b both). Points are in the frame of the sensor: its pose is sent like the one of a shape (3D|name:P:...:R:...). Binary: section POINT_CLOUD, in parts when a cloud does not fit in a packet.", () => {
      // Text: a 2D lidar (z = 0) that drives on a circle in a room of 6 x 4 m, 180 rays, intensity = 1 / distance
      const room = (x, y, angle) => { const dx = Math.cos(angle), dy = Math.sin(angle); return Math.min(dx > 0 ? (3 - x) / dx : (-3 - x) / dx, dy > 0 ? (2 - y) / dy : (-2 - y) / dy); };
      setInterval(() => {
        const ms = Date.now(), t = ms / 1000, x = 1.5 * Math.cos(t / 3), y = Math.sin(t / 3), yaw = t / 3 + Math.PI / 2;
        const points = [];
        for (let i = 0; i < 180; i++) {
          const angle = i / 180 * 2 * Math.PI, d = room(x, y, yaw + angle) + (Math.random() - 0.5) * 0.02;
          points.push(`${(Math.cos(angle) * d).toFixed(3)}:${(Math.sin(angle) * d).toFixed(3)}:0:${(1 / d).toFixed(3)}`);
        }
        Teleplot.parseDataText(`3D|cloud.scan:${ms}:P:${x.toFixed(3)}:${y.toFixed(3)}:0.2:R:0:0:${yaw.toFixed(3)}`); // where the sensor is
        Teleplot.parseDataText(`cloud.scan:${ms};${points.join(";")}|pc`);
      }, 100);

      // Binary: a 3D cloud of 40 x 40 points with a color each (flags = POINT_CLOUD_RGB), one part
      new Packet(CLIENT).u8(P.SECTION_TYPE_TELEM_ATTR).u16(60).u8(1).u8(P.TELEM_ATTR_NAME).str("cloud.surface").send();
      setInterval(() => {
        const t = Date.now() / 1000;
        new Packet(CLIENT).section(P.SECTION_TYPE_TELEM_DATA_POINT_CLOUD, 60, (p) => {
          p.u8(P.POINT_CLOUD_RGB).u16(0).u16(1).u16(1600); // flags, part index, part count, points in this part
          for (let i = 0; i < 40; i++) for (let j = 0; j < 40; j++) {
            const x = i / 10 - 2, y = j / 10 - 2, z = 1.2 + 0.3 * Math.sin(x * 2 + t) * Math.cos(y * 2);
            p.f32(x).f32(y).f32(z).u8(Math.round(i * 6.5)).u8(Math.round(j * 6.5)).u8(Math.round(128 + 400 * (z - 1.2)));
          }
        }).send();
      }, 200);
    });

        Teleplot.parseDataText(`2D|d2.robot:P:${x.toFixed(3)}:${y.toFixed(3)}:R:${heading.toFixed(3)}\nd2.pos:${x.toFixed(3)}:${y.toFixed(3)}|xy\nd2.scan:${points.join(";")}|pc`);
      }, 50);
    });

    section("Images and cameras", "ViewImage: the pictures of an image telemetry, with 3D telemetries drawn over them as its camera saw them. The camera is described by intrinsics (and optionally lens distortion) in the usual image convention, and by a pose in the frame of the scene. Pictures are shown as received, never undistorted; nothing is interpolated: each picture is shown with the samples in effect when it was taken.");

    data("Two cameras turning around a cube", "The pictures are drawn here, point by point, with ViewImage.projectPoint (the camera model, lens distortion included): white lines for the edges of a cube and of a square on the ground. The views below draw the cube and the square themselves over the pictures: they must fit the white lines, whatever the cameras do. Camera 1 uses the text protocol (K, P, Q); camera 2 the binary protocol, with distortion.", () => {
      const S = Teleplot.view.ViewScene3D, V = Teleplot.view.ViewImage;
      Teleplot.parseDataText("3D|imgdemo.cube:S:cube:P:2:0:0.5:W:1:D:1:H:1:C:#e67e22");
      Teleplot.parseDataText("3D|imgdemo.ground:S:cube:P:2:0:-0.01:W:3:D:3:H:0.02:C:#3498db");
      setInterval(() => { const ms = Date.now(), t = ms / 500; Teleplot.parseDataText(`imgdemo.orbit:${(2 + Math.cos(t)).toFixed(3)}:${Math.sin(t).toFixed(3)}:1.2:${ms}|xyz`); }, 50);

      const box = (cx, cy, cz, sx, sy, sz) => { // the 12 edges of a box, as pairs of points
        const c = [];
        for (const dx of [-1, 1]) for (const dy of [-1, 1]) for (const dz of [-1, 1]) c.push([cx + dx * sx / 2, cy + dy * sy / 2, cz + dz * sz / 2]);
        const edges = [];
        for (let a = 0; a < 8; a++) for (let b = a + 1; b < 8; b++) if ([0, 1, 2].filter((k) => c[a][k] != c[b][k]).length == 1) edges.push([c[a], c[b]]);
        return edges;
      };
      const edges = box(2, 0, 0.5, 1, 1, 1).concat(box(2, 0, -0.01, 3, 3, 0.02));
      const toCamera = (camera, p) => { // world -> frame of the camera: rotation by the inverse of its quaternion
        const [w, x, y, z] = camera.quaternion, v = [p[0] - camera.position[0], p[1] - camera.position[1], p[2] - camera.position[2]];
        const q = [-x, -y, -z], t = [2 * (q[1] * v[2] - q[2] * v[1]), 2 * (q[2] * v[0] - q[0] * v[2]), 2 * (q[0] * v[1] - q[1] * v[0])];
        return [v[0] + w * t[0] + q[1] * t[2] - q[2] * t[1], v[1] + w * t[1] + q[2] * t[0] - q[0] * t[2], v[2] + w * t[2] + q[0] * t[1] - q[1] * t[0]];
      };
      const canvas = document.createElement("canvas"), g = canvas.getContext("2d");
      const picture = (camera, label) => { // base64 PNG of what the camera sees
        canvas.width = camera.width; canvas.height = camera.height;
        g.fillStyle = "#2c3e50"; g.fillRect(0, 0, camera.width, camera.height);
        g.strokeStyle = "white"; g.lineWidth = 1.5;
        for (const [a, b] of edges) {
          g.beginPath();
          let drawing = false;
          for (let i = 0; i <= 40; i++) { // many points per edge: a distorted edge is a curve
            const pixel = V.projectPoint(camera, toCamera(camera, [0, 1, 2].map((k) => a[k] + (b[k] - a[k]) * i / 40)));
            if (!pixel) { drawing = false; continue; }
            if (drawing) g.lineTo(pixel[0] + 0.5, pixel[1] + 0.5); else g.moveTo(pixel[0] + 0.5, pixel[1] + 0.5); // canvas coordinates start at the corner of the pixel
            drawing = true;
          }
          g.stroke();
        }
        g.fillStyle = "white"; g.font = "11px sans-serif"; g.fillText(label, 6, 14);
        return canvas.toDataURL("image/png").split(",")[1];
      };
      const pose = (t, radius, height) => { // turns around the cube, looking at it (the camera looks along its x), with a bit of roll
        const angle = t / 4, position = [2 + radius * Math.cos(angle), radius * Math.sin(angle), height];
        const yaw = Math.atan2(-position[1], 2 - position[0]), pitch = Math.atan2(height - 0.5, radius);
        return { position, quaternion: S.eulerToQuaternion(0.15 * Math.sin(t), pitch, yaw) };
      };

      const pinhole = { width: 320, height: 240, fx: 260, fy: 255, cx: 150.5, cy: 125.5, distortion: undefined };
      const wide = { width: 320, height: 240, fx: 170, fy: 170, cx: 159.5, cy: 119.5, distortion: [-0.32, 0.11, 0.004, -0.003, -0.012] };
      new Packet(CLIENT).u8(P.SECTION_TYPE_TELEM_ATTR).u16(20).u8(1).u8(P.TELEM_ATTR_NAME).str("imgdemo.camera.distorted").send();
      const shoot = () => {
        const ms = Date.now(), t = ms / 1000;
        // Camera 1, text protocol: the camera first (it is the one in effect when the picture comes), then the picture
        const a = Object.assign({}, pinhole, pose(t, 3.2, 1.6));
        const [w, x, y, z] = a.quaternion;
        Teleplot.parseDataText(`3D|imgdemo.camera.pinhole:${ms}:K:${a.fx}:${a.fy}:${a.cx}:${a.cy}:${a.width}:${a.height}:P:${a.position.join(":")}:Q:${x}:${y}:${z}:${w}:W:0.6`);
        Teleplot.parseDataText(`PNG|imgdemo.camera.pinhole:${ms}:${picture(a, "pinhole, text protocol")}`);

        // Camera 2, binary protocol. It carries float32: the picture is drawn with the values the viewer will get
        const b = Object.assign({}, wide, pose(-t * 0.7, 2.4, 1.1));
        b.position = Array.from(new Float32Array(b.position)); b.quaternion = Array.from(new Float32Array(b.quaternion)); b.distortion = Array.from(new Float32Array(b.distortion));
        const bytes = Uint8Array.from(atob(picture(b, "wide angle with distortion, binary protocol")), (c) => c.charCodeAt(0));
        new Packet(CLIENT)
          .section(P.SECTION_TYPE_TELEM_DATA_CAMERA_INTRINSICS, 20, (p) => p.u16(b.width).u16(b.height).f32(b.fx).f32(b.fy).f32(b.cx).f32(b.cy))
          .section(P.SECTION_TYPE_TELEM_DATA_CAMERA_DISTORTION, 20, (p) => b.distortion.forEach((v) => p.f32(v)))
          .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_3D_POSITION, 20, (p) => b.position.forEach((v) => p.f32(v)))
          .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_3D_QUATERNION, 20, (p) => b.quaternion.forEach((v) => p.f32(v)))
          .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_SIZE, 20, (p) => p.f32(0.6).f32(1).f32(1)) // x: how far the camera is drawn in 3D views
          .section(P.SECTION_TYPE_TELEM_DATA_IMAGE, 20, (p) => { p.u8(P.IMAGE_TYPE_PNG).u16(0).u16(1).u16(bytes.length); p.bytes.push(...bytes); }) // part 0 of 1
          .send();
      };
      shoot();
      setInterval(shoot, 200);
    });
    demo("Pinhole camera, whole objects", "outline off. The orange cube and the blue ground must stay on the white lines of the picture.", [480, 360], (id) => {
      const view = new Teleplot.view.ViewImage(id, ["imgdemo.camera.pinhole", "imgdemo.cube", "imgdemo.ground"]); // the first image telemetry is the picture

    // ====================================================================================================================== Depth maps
    section("Depth maps", "Pictures of values: a 16-bit grayscale PNG, or plain pixels (RAW|: gray16 or float32, see doc/depth.md). The library decodes them itself (a browser only gives 8 bits of a picture) and keeps what was received untouched. A pixel is worth its number times the scale of the telemetry (ATTR|name|scale=0.001), in its unit; 0 is no measure (nodata=). Image views draw the values in colors, one color per pixel; the pointer reads the value under it. A depth map with camera intrinsics is placed in 3D and 2D views: each pixel along its ray, at its distance along the axis of the camera.");

    data("A pretend depth camera", "depthdemo.mm: 160 x 120, uint16 in millimetres (RAW| text line, scale 0.001, unit m), 10 times per second. depthdemo.png: the same as a 16-bit PNG (encoded here with CompressionStream), with a range 0 to 6 m. depthdemo.float (binary, float32 in metres, with lens distortion and NaN where nothing is seen). The scene: the ground, a wall at 6 m, a box, and a ball (depthdemo.ball, also sent as a shape: in the 3D view the points must lie on it).", () => {
      const W = 160, H = 120;
      const camera = { width: W, height: H, fx: 120, fy: 120, cx: 79.5, cy: 59.5 };
      const distortion = [-0.25, 0.06, 0, 0, 0];
      const pose = { position: [0, 0, 1.2], quaternion: Teleplot.view.ViewScene3D.eulerToQuaternion(0, 0.25, 0) }; // looks a bit down
      const rotate = Teleplot.view.ViewScene3D.rotateVector;
      const box = { min: [2.4, -1.4, 0], max: [3.1, -0.7, 0.9] };
      // Distance along the axis of the camera of what the ray of pixel (u, v) meets first (0: nothing within 8 m)
      const cast = (ray, ball) => {
        const d = rotate(pose.quaternion, ray), o = pose.position; // (ray: x = 1 in the frame of the camera: t is the depth)
        let best = Infinity;
        if (d[2] < 0) best = Math.min(best, -o[2] / d[2]);                 // the ground
        if (d[0] > 0) best = Math.min(best, (6 - o[0]) / d[0]);            // a wall at x = 6
        let near = -Infinity, far = Infinity;                              // the box
        for (let k = 0; k < 3; k++) {
          let a = (box.min[k] - o[k]) / d[k], b = (box.max[k] - o[k]) / d[k];
          near = Math.max(near, Math.min(a, b)); far = Math.min(far, Math.max(a, b));
        }
        if (near <= far && near > 0) best = Math.min(best, near);
        const c = [o[0] - ball.center[0], o[1] - ball.center[1], o[2] - ball.center[2]]; // the ball
        const A = d[0]*d[0] + d[1]*d[1] + d[2]*d[2], B = 2 * (c[0]*d[0] + c[1]*d[1] + c[2]*d[2]), C = c[0]*c[0] + c[1]*c[1] + c[2]*c[2] - ball.radius * ball.radius;
        const disc = B * B - 4 * A * C;
        if (disc >= 0) { const t = (-B - Math.sqrt(disc)) / (2 * A); if (t > 0) best = Math.min(best, t); }
        return best <= 8 ? best : 0;
      };
      const header = (format) => [W & 255, W >> 8, H & 255, H >> 8, format, 0, 0, 0];
      const base64 = (bytes) => { let text = ""; for (let i = 0; i < bytes.length; i += 0x8000) text += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(text); };
      const png16 = async (values) => { // A 16-bit gray PNG: filter 0 on every row, deflated by the browser (CRCs left at 0: not checked)
        const raw = new Uint8Array(H * (W * 2 + 1));
        for (let v = 0; v < H; v++) for (let u = 0; u < W; u++) { const n = values[v * W + u], at = v * (W * 2 + 1) + 1 + u * 2; raw[at] = n >> 8; raw[at + 1] = n & 255; }
        const idat = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate"))).arrayBuffer());
        const chunk = (type, data) => { const out = new Uint8Array(12 + data.length), view = new DataView(out.buffer); view.setUint32(0, data.length); out.set([...type].map((c) => c.charCodeAt(0)), 4); out.set(data, 8); return out; };
        const ihdr = new Uint8Array(13), view = new DataView(ihdr.buffer); view.setUint32(0, W); view.setUint32(4, H); ihdr[8] = 16; ihdr[9] = 0;
        const parts = [Uint8Array.from([0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A]), chunk("IHDR", ihdr), chunk("IDAT", idat), chunk("IEND", new Uint8Array(0))];
        return base64(new Uint8Array(await new Blob(parts).arrayBuffer()));
      };
      const [w, x, y, z] = pose.quaternion;
      const place = `K:${camera.fx}:${camera.fy}:${camera.cx}:${camera.cy}:${W}:${H}:P:${pose.position.join(":")}:Q:${x}:${y}:${z}:${w}:W:0.5`;
      Teleplot.parseDataText(`ATTR|depthdemo.mm|scale=0.001|unit=m|desc=Depth in millimetres (uint16)\nATTR|depthdemo.png|scale=0.001|unit=m|min=0|max=6\n3D|depthdemo.ball:S:sphere:C:#e67e22:O:0.35`);
      const attr = new Packet(CLIENT).u8(P.SECTION_TYPE_TELEM_ATTR).u16(80).u8(3).u8(P.TELEM_ATTR_NAME).str("depthdemo.float").u8(P.TELEM_ATTR_UNIT).str("m").u8(P.TELEM_ATTR_PIXELS);
      attr.bytes.push(...new Uint8Array(new Float64Array([1, NaN]).buffer), 0); // scale 1, no number means "no measure" (NaN never is one), a depth map
      attr.send();
      const shoot = async () => {
        const t = Date.now() / 1000, ms = Date.now();
        const ball = { center: [3.2 + 0.8 * Math.sin(t / 2), 0.6 * Math.cos(t / 1.3), 0.35], radius: 0.35 };
        const mm = new Uint16Array(W * H), metres = new Float32Array(W * H);
        for (let v = 0; v < H; v++) for (let u = 0; u < W; u++) {
          const depth = cast([1, -(u - camera.cx) / camera.fx, -(v - camera.cy) / camera.fy], ball);
          mm[v * W + u] = Math.round(depth * 1000);
          const [xd, yd] = Teleplot.view.ViewImage.undistortPoint((u - camera.cx) / camera.fx, (v - camera.cy) / camera.fy, distortion); // the lens of the float camera
          const seen = cast([1, -xd, -yd], ball);
          metres[v * W + u] = seen > 0 ? seen : NaN;
        }
        Teleplot.parseDataText(`3D|depthdemo.ball:${ms}:P:${ball.center.join(":")}:SC:${2 * ball.radius}`);
        Teleplot.parseDataText(`3D|depthdemo.mm:${ms}:${place}\nRAW|depthdemo.mm:${ms}:` + base64(Uint8Array.from([...header(P.RAW_FORMAT_GRAY16), ...new Uint8Array(mm.buffer)])));
        // Float32 through the binary protocol, in two parts (a part holds at most 65535 bytes)
        const bytes = Uint8Array.from([...header(P.RAW_FORMAT_FLOAT32), ...new Uint8Array(metres.buffer)]);
        const half = Math.ceil(bytes.length / 2);
        const packet = new Packet(CLIENT)
          .section(P.SECTION_TYPE_TELEM_DATA_CAMERA_INTRINSICS, 80, (p) => p.u16(W).u16(H).f32(camera.fx).f32(camera.fy).f32(camera.cx).f32(camera.cy))
          .section(P.SECTION_TYPE_TELEM_DATA_CAMERA_DISTORTION, 80, (p) => distortion.forEach((v) => p.f32(v)))
          .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_3D_POSITION, 80, (p) => pose.position.forEach((v) => p.f32(v)))
          .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_3D_QUATERNION, 80, (p) => pose.quaternion.forEach((v) => p.f32(v)));
        for (let part = 0; part < 2; part++) {
          const piece = bytes.subarray(part * half, (part + 1) * half);
          packet.section(P.SECTION_TYPE_TELEM_DATA_IMAGE, 80, (p) => { p.u8(P.IMAGE_TYPE_RAW).u16(part).u16(2).u16(piece.length); p.bytes.push(...piece); });
        }
        packet.send();
        const png = await png16(mm);
        Teleplot.parseDataText(`3D|depthdemo.png:${ms}:${place}\nPNG|depthdemo.png:${ms}:${png}`);
      };
      shoot();
      setInterval(shoot, 100);
    });
    demo("A depth map (gray16, text protocol)", "Colors from the 1st to the 99th percentile of each picture (no range given); the color scale is at the bottom. Hover the picture: the value of the pixel, in metres (number x scale), and where it is. Pixels without measure (0) would stay empty.", [420, 330], (id) => {

    // ====================================================================================================================== Sources
    section("Sources", "Where the data comes from: connections to a Teleplot server (UDP relayed through a WebSocket) and serial ports opened by the browser itself (Web Serial). Each connection counts what it receives, and the telemetries know which one sent them. See doc/sources.md.");

    demo("Serial port, read by the browser", "Needs Chrome, Edge or Opera and a device (or the simulated one). Lines starting with > are telemetry (>temp:24.5), the others are log lines of the port; every line is also kept in a console. The box below is that console and what the connection counts; the telemetries show up in the automatic dashboard at the bottom of the page.", [520, 260], (id) => {
      const box = document.getElementById(id);
      box.innerHTML = '<button>Choose a serial port…</button> <button>Simulated device</button> <button>Send "ping"</button><pre style="height: 200px; margin-top: 8px"></pre>';
      const [choose, simulate, send] = box.querySelectorAll("button"), out = box.querySelector("pre");
      let connection;
      choose.disabled = !Teleplot.connection.serialSupported(); // Web Serial is not in every browser
      choose.onclick = async () => { connection = await Teleplot.connection.requestSerialPort(115200) || connection; }; // the browser asks which port
      simulate.onclick = () => { // a fake port: what the library needs from one (open, close, getInfo, two streams)
        let feed;
        const port = { getInfo: () => ({}), close: async () => clearInterval(feed), open: async () => {
          port.readable = new ReadableStream({ start(c) { feed = setInterval(() => c.enqueue(new TextEncoder().encode(`>serial.demo:${Math.sin(Date.now() / 500).toFixed(3)}\nstill alive\n>broken line\n`)), 500); } });
          port.writable = new WritableStream({ write() {} });
        } };
        connection = Teleplot.connection.addConnectionSerial(port, 115200);
      };
      send.onclick = () => connection && connection.send("ping", "\n");
      setInterval(() => {
        if (!connection) return;
        const lines = connection.console.lines.slice(-9).map((l) => (l.sent ? "← " : "") + l.text + (l.problem ? "   (not understood)" : ""));
        out.textContent = `${connection.name}: ${connection.connected ? "connected" : (connection.error || "closed")}, ${connection.stats.messages} lines, ${connection.stats.problems} not understood\n\n` + lines.join("\n");
      }, 250);
    });
    demo("Connection to a Teleplot server", "Start packages/server (node main.js) to see it connect; it is tried again every 2 seconds until then. Send a line to UDP port 47269 (see the Help of the webapp) and it shows up here and in the automatic dashboard.", [520, 110], (id) => {

      const out = document.getElementById(id).appendChild(document.createElement("pre"));
      setInterval(() => {
        const state = connection.connected ? "connected" : (connection.everConnected ? "connection lost" : "cannot be reached") + ", next try in " + Math.max(0, Math.ceil((connection.nextRetryAt - Date.now()) / 1000)) + " s";
        const mine = Object.values(Teleplot.datastore.telemetries).filter((t) => t.sourceId === connection.id).length;
        out.textContent = `${connection.name}: ${state}\n${connection.stats.messages} messages, ${connection.stats.problems} not understood, ${mine} telemetries from it`;

    // ====================================================================================================================== Commands
    section("Commands", "Telecmd: the page changes settings of a device and calls its actions (doc/telecmd.md). A setting is a writable telemetry: the page sends the line the device would send, and the device's echo is the acknowledgement. An action is a call with named, typed arguments, answered run, then ok or err. Nothing is sent, and no control is drawn, while Teleplot.state.commands is off (the CMD button of the webapp).");

    data("A device in the page", "cmd.* telemetries come from a local connection (Teleplot.connection.addConnectionLocal): a source of the page that gets what the page writes. It declares its settings and actions with ATTR lines, applies a write after 50 to 400 ms, keeps cmd.limit at 1.5 at most, refuses \"fast\" while cmd.power is off, runs cmd.move for a second, and drops cmd.drive 300 ms after the last write.", () => {
      const state = { limit: 1, power: 1, mode: "slow", drive: [0, 0, 0], driveAt: 0, pose: [1, 1, 0.5] };
      const device = Teleplot.connection.addConnectionLocal("Device of the page", (message) => {
        for (const line of message.text.split("\n")) setTimeout(() => apply(line), 50 + Math.random() * 350);
      });
      const send = (text) => device.sendText(text);
      const publish = () => send([`cmd.limit:${state.limit}`, `cmd.power:${state.power}`, `cmd.mode:${state.mode}|t`, `cmd.pose:${state.pose.join(":")}|xyz`, `cmd.drive:${state.drive.join(":")}|xyz`].join("\n"));
      const ran = new Map(); // A call sent again is answered again, never run twice
      function apply(line) {
        if (line.startsWith("!")) {
          const [head, ...args] = line.slice(1).split(":"), [name, id] = head.split("#");
          if (ran.has(head)) return send(`ACK|${head}:${ran.get(head)}`);
          ran.set(head, "run"); send(`ACK|${head}:run`);
          const to = (args.find((a) => a.startsWith("to=")) || "to=0,0").slice(3).split(",").map(Number);
          return setTimeout(() => { const ok = to.every((v) => Math.abs(v) <= 5); ran.set(head, ok ? "ok" : "err:out of reach"); send(`ACK|${head}:${ran.get(head)}`); if (ok) state.pose = [to[0], to[1], state.pose[2]]; }, 1000);
        }
        const [name, ...values] = line.split(":");
        if (name == "cmd.limit") state.limit = Math.min(1.5, Number(values[0]));
        if (name == "cmd.power") state.power = Number(values[0]);
        if (name == "cmd.mode") { if (values[0] == "fast" && !state.power) send("ACK|cmd.mode:err:power off"); else state.mode = values[0]; }
        if (name == "cmd.pose") state.pose = values.map(Number);
        if (name == "cmd.drive") { state.drive = values.map(Number); state.driveAt = Date.now(); }
        publish();
      }
      send([
        "ATTR|cmd.limit|write|min=0|max=2|step=0.1|unit=m/s|desc=Speed limit: the device keeps 1.5 at most",
        "ATTR|cmd.power|write=bool",
        "ATTR|cmd.mode|write|desc=fast is refused while the power is off",
        "cmd.mode:slow,fast#refused while the power is off,off|enum", // (the texts it can take: an enum structure, with a caption)
        "ATTR|cmd.drive|write=pose2d|rate=20|hold=300|min=-1|max=1",
        "ATTR|cmd.turn|write=number|rate=20|hold=300|min=-1|max=1",
        "ATTR|cmd.pose|write=pose2d",
        "ATTR|cmd.reset|action|title=Reset|confirm",
        "ATTR|cmd.move|action|title=Move|desc=Moves the pose to a point",
        "ATTR|cmd.move|arg=to|type=xy|desc=x and y, within 5",
        "ATTR|cmd.move|arg=speed|type=number|optional|default=1|min=0.1|max=2",
        "ATTR|cmd.stop|action|title=Stop|color=#d6453d|longpress",
      ].join("\n"));
      setInterval(() => { if (Date.now() - state.driveAt > 300 && state.drive.some((v) => v)) state.drive = [0, 0, 0]; publish(); }, 250); // (it publishes what it applies: that is its echo)
    });
    demo("CMD", "Off by default: views draw no control and nothing is sent. Switch it on to use the demos of this section.", [360, 44], (id) => {
      const box = document.getElementById(id), button = box.appendChild(document.createElement("button")), info = box.appendChild(document.createElement("span"));
      const show = () => { button.textContent = Teleplot.state.commands ? "CMD ON: switch off" : "CMD OFF: switch on"; const s = Teleplot.commands.summary(); info.textContent = `  ${s.settings} settings, ${s.actions} actions`; };
      button.onclick = () => { Teleplot.commands.setEnabled(!Teleplot.state.commands); show(); };

    demo("Settings and actions in a values view", "CMD on: a pen after what can be changed. Drag the bar of cmd.limit (the caret is the target; ask more than 1.5 and it turns amber: the device keeps 1.5), click a value to type it, the switch, the choices of cmd.mode (fast is refused while the power is off), the buttons (Reset asks first, Stop must be held, Move opens a form with its arguments). The icon tells how a request ended.", [380, 360], (id) => {

    // ====================================================================================================================== Dashboards
    section("Dashboards", "A dashboard is a named layout. The automatic one displays new telemetries without any setup: numbers get a chart, shapes and 3D points share one 3D scene, images get an image view, the rest a values view.");

    demo("Automatic dashboard", "Only telemetries created after enableAutoDashboard() are displayed. auto.sin and auto.text have no label: a view each. auto.left, auto.right and auto.state have the view label \"motors\" (name,label in the text protocol): the two numbers share a chart titled with the label, the text gets the values view of the label. The library does not decide where a dashboard goes on the page: the callback puts it in this card.", ["100%", "auto"], (id) => {
      Teleplot.dashboards.enableAutoDashboard("Auto demo", (dashboard) => {
        const element = document.createElement("div");
        element.id = dashboard.getView().divId;
        document.getElementById(id).appendChild(element);
      });
      setInterval(() => {
        const now = Date.now() / 1000;
        Teleplot.datastore.getOrCreateTelemetry("auto.sin").addData(P.SECTION_TYPE_TELEM_DATA_NUMBER, [now], [[Math.sin(now)]]);
        Teleplot.datastore.getOrCreateTelemetry("auto.text").addData(P.SECTION_TYPE_TELEM_DATA_TEXT, [now], [["auto " + Math.floor(now % 10)]]);
        Teleplot.parseDataText(`auto.left,motors:${Math.sin(now * 2).toFixed(3)}\nauto.right,motors:${Math.cos(now * 2).toFixed(3)}\nauto.state,motors:${Math.sin(now * 2) > 0 ? "forward" : "backward"}|t`);
      }, 50);
    });

    demo("Dashboards as text: received, exported, imported", "A dashboard is also a text, one line per view addressed by its path: DASH|dashboard/view:type:telemetries|option=value. Here the text protocol receives three lines, the binary protocol a fourth (section SECTION_TYPE_DASHBOARD), and two views follow a group (follow=climate) that two telemetries are in (dash.temp,climate): each takes what it shows. Lines can come in any order, missing layouts are created; a line received again changes nothing, a line that changed updates its view (the chart grows and shrinks every 4 seconds). Under the dashboard: what exportText() gives, which importText() turns back into a dashboard.", ["100%", "auto"], (id) => {
      const card = document.getElementById(id);
      const exported = document.createElement("pre");
      exported.style.cssText = "margin: 0.8em 0 0; font-size: 0.85em; white-space: pre-wrap;";
      Teleplot.dashboards.onReceivedDashboardHooks.push((dashboard) => {
        if (dashboard.name !== "Text demo") return;
        const element = document.createElement("div");
        element.id = dashboard.getView().divId;
        card.append(element, exported);
      });
      Teleplot.parseDataText([
        "DASH|Text demo/right/State:values:dash.state|displayLayoutRow=true",  // "right" does not exist yet: created
        "DASH|Text demo:row",
        "DASH|Text demo/Waves:chart:dash.sin,dash.cos|w=3|h=3",
        "DASH|Text demo/right/Temp:chart|follow=climate",  // takes the numbers of the group
        "DASH|Text demo/right/Note:values|follow=climate", // and this one its texts
      ].join("\n"));
      new Packet(CLIENT).u8(P.SECTION_TYPE_DASHBOARD).str("DASH|Text demo/right:column|w=2").send();
      setInterval(() => {
        const now = Date.now() / 1000;
        Teleplot.parseDataText(`dash.sin:${Math.sin(now).toFixed(3)}\ndash.cos:${Math.cos(now).toFixed(3)}\ndash.state:${Math.sin(now) > 0 ? "up" : "down"}|t`);
        Teleplot.parseDataText(`dash.temp,climate:${(20 + Math.sin(now / 3)).toFixed(2)}\ndash.note,climate:${Math.floor(now % 60)} s|t`); // A group: the views that follow it take them
        Teleplot.parseDataText(`DASH|Text demo/Waves|h=${Math.floor(now / 4) % 2 ? 3 : 4}`); // Same line most of the time: nothing happens
        exported.textContent = Teleplot.dashboards.exportText("Text demo");
      }, 100);
    });

    // ====================================================================================================================== Data files
    section("Data files", "What the datastore holds, written to a file and read back (Teleplot.files). A file is what a device would have sent: the lines of the text protocol, or the packets of the binary protocol, each after its length. Reading goes through the parsers of the protocols.");

    demo("Export: binary, text and CSV", "Every 2 seconds the telemetries dash.sin, dash.cos and dash.state are exported the three ways (options: telemetries, from, to, dashboards). CSV is a table for spreadsheets: a column per telemetry, an empty cell where a telemetry has no sample at that very time (dash.state here, sent with the others, has none empty). Binary gives back exactly what was stored (float64 where a float32 would round) and is about three times smaller; text is readable and is what a device can log to an SD card. Below: the sizes, then the start of the text file.", [700, 250], (id) => {
      const card = document.getElementById(id);
      card.style.cssText += "font: 0.85em ui-monospace, monospace; white-space: pre-wrap; overflow: auto;";
      const size = (parts) => (parts.reduce((sum, part) => sum + part.length, 0) / 1024).toFixed(1) + " kB";
      setInterval(() => {
        const options = { telemetries: ["dash.sin", "dash.cos", "dash.state"], dashboards: ["Text demo"] };
        const binary = Teleplot.files.exportBinary(options), text = Teleplot.files.exportText(options);
        // CSV: for spreadsheets (numbers and text only). Options: layout "columns" or "lines", separator "," ";" or a tab, time "iso", "ms" or "s"
        const csvOptions = { telemetries: options.telemetries, separator: ";", time: "ms" };
        const csv = Teleplot.files.exportCSV(csvOptions), guess = Teleplot.files.estimate("csv", csvOptions), preview = Teleplot.files.previewCSV(csvOptions, 3);
        card.textContent = `binary: ${binary.samples} samples, ${size(binary.parts)}, skipped ${binary.skipped}\ntext:   ${text.samples} samples, ${size(text.parts)}, skipped ${text.skipped}\n`
          + `csv:    ${csv.samples} values, ${size(csv.parts)} (estimate() said ${(guess.bytes / 1024).toFixed(1)} kB before writing), left out ${csv.leftOut}\n\n`
          + "previewCSV: " + JSON.stringify(preview.header) + " " + preview.rows.map((row) => JSON.stringify(row)).join(" ") + "\n\n" + text.parts.join("").slice(0, 700) + "...";
      }, 2000);
    });

    demo("Import: a file logged by a device, and a binary file", "At the start of the page two files are read: a text file as a device would log it (lines of the text protocol with their own time, here one hour old, and a DASH line: its dashboard is created as a new one) and a binary file as a device would write it (the header, then each packet after its length), read in pieces of 100 bytes: the same temperature without its small steps, sent by a client 9. The dashboard below is the one the text file describes; under it, what each import returned: first a dry run of the text file (nothing stored, it says what opening would do), then the imports, then a small CSV that is opened and taken back.", ["100%", "auto"], (id) => {
      const card = document.getElementById(id);
      const start = Date.now() - 3600000;
      const lines = ["DASH|File demo/Recorded:chart:file.temp,file.fan|w=4|h=3"];
      for (let i = 0; i < 300; i++) lines.push(`file.temp:${start + i * 1000}:${(40 + 15 * Math.sin(i / 30) + (i % 7) * 0.3).toFixed(2)}§°C`, `file.fan:${start + i * 1000}:${Math.sin(i / 30) > 0.5 ? 1 : 0}`);
      const described = Teleplot.files.importData(lines.join("\n"), { dryRun: true }); // Nothing is stored nor created: what the file holds
      const fromText = Teleplot.files.importData(lines.join("\n"));
      // A CSV, opened then taken back: removeImported removes what an import brought
      const fromCSV = Teleplot.files.importData("time;file.csv\n" + start + ";1\n" + (start + 1000) + ";2\n");
      const removed = Teleplot.files.removeImported(fromCSV);

      // The same data as a binary file a device would write: the header, then each packet after its length
      const header = Uint8Array.from(P.FILE_MAGIC), records = [];
      for (let i = 0; i < 300; i += 4) {
        const packet = new Packet(9).u8(P.SECTION_TYPE_TELEM_ATTR).u16(1).u8(1).u8(P.TELEM_ATTR_NAME).str("file.temp (binary)");
        packet.u8(P.SECTION_TYPE_TELEM_DATA_NUMBER).u16(1).u64(BigInt(start + i * 1000) * 1000000n).u8(4);
        for (let n = 0; n < 4; n++) packet.u32(n * 1000000000).f32(40 + 15 * Math.sin((i + n) / 30)); // 4 samples a second apart (a time difference reaches 4.29 s)
        const bytes = [...packet.bytes, 0, 0];
        records.push(...new Uint8Array(new Uint32Array([bytes.length]).buffer), ...bytes);
      }
      const file = Uint8Array.from([...header, ...records]);
      const job = Teleplot.files.createImport();
      for (let at = 0; at < file.length; at += 100) job.add(file.slice(at, at + 100));
      const fromBinary = job.finish();

      const dashboard = Teleplot.dashboards.getDashboard(fromText.dashboards[0]);
      dashboard.getView().views[0].addTelemetry(9 * 0x10000 + 1);
      const element = document.createElement("div");
      element.id = dashboard.getView().divId;
      const report = document.createElement("pre");
      report.style.cssText = "margin: 0.8em 0 0; font-size: 0.85em; white-space: pre-wrap;";
      const short = (result) => JSON.stringify({ ...result, telemetries: result.telemetries.length, ranges: result.ranges.length, createdIds: undefined });
      report.textContent = "dry run:     " + short(described) + "\ntext file:   " + short(fromText) + "\nbinary file: " + short(fromBinary) + "\nCSV file:    " + short(fromCSV) + "\nremoveImported(CSV): " + removed + " samples removed, file.csv " + (Teleplot.datastore.getTelemetry("file.csv") ? "still there" : "forgotten");
      card.append(element, report);
    });
  </script>
</body>
