<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teleplot JS Test page</title>
  <script src="teleplot-js.js"></script>
  <style>
    /* Page only: the views are styled by the library (and follow its theme variables, like this page) */
    body { margin: 0; background: var(--teleplot-bg); color: var(--teleplot-text); font: 14px/1.45 system-ui, sans-serif; }
    header { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--teleplot-surface); border-bottom: 1px solid var(--teleplot-line); }
    header h1 { margin: 0 auto 0 0; font-size: 16px; }
    header button, header a { font: inherit; color: inherit; padding: 3px 10px; border: 1px solid var(--teleplot-line); border-radius: 6px; background: none; cursor: pointer; text-decoration: none; }
    .page { display: grid; grid-template-columns: 210px minmax(0, 1fr); }
    nav { position: sticky; top: 46px; align-self: start; max-height: calc(100vh - 46px); overflow: auto; padding: 12px 8px; box-sizing: border-box; }
    nav a { display: flex; justify-content: space-between; padding: 4px 10px; border-radius: 6px; color: var(--teleplot-muted); text-decoration: none; }
    nav a:hover, nav a.active { color: var(--teleplot-text); background: color-mix(in srgb, var(--teleplot-text) 8%, transparent); }
    main { padding: 0 20px 60vh 12px; min-width: 0; }
    section { scroll-margin-top: 54px; }
    h2 { margin: 28px 0 4px; font-size: 20px; }
    .intro { margin: 0 0 12px; max-width: 75em; color: var(--teleplot-muted); }
    .demo { margin: 0 0 14px; padding: 10px 12px; border: 1px solid var(--teleplot-line); border-radius: 10px; }
    .demo h3 { margin: 0; font-size: 14px; }
    .demo .note { margin: 2px 0 8px; color: var(--teleplot-muted); }
    .demo-body { display: flex; gap: 12px; align-items: flex-start; }
    .demo-body.wide { flex-direction: column; }
    /* The box of a demo: the view fills it. A view has a minimum height of its own (from its layout height): when a demo asks for a precise
       size (to test small and short views) that minimum is lifted so the view really has that size; otherwise the box grows with the view. */
    .demo-view { flex: none; max-width: 100%; display: grid; }
    .demo-view > div { min-width: 0; min-height: 0; }
    .demo-view.exact .teleplot-js-telemetry-card { min-height: 0 !important; }
    pre { flex: 1 1 0; min-width: 0; max-height: 24em; margin: 0; padding: 8px 10px; overflow: auto; box-sizing: border-box; border-radius: 6px; font: 12px/1.45 var(--teleplot-mono);
          background: var(--teleplot-surface); border: 1px solid var(--teleplot-line); white-space: pre; scrollbar-width: thin; }
    .wide > pre, details > pre { flex: none; width: 100%; }
    details summary { cursor: pointer; color: var(--teleplot-muted); }
    details[open] summary { margin-bottom: 6px; }
    @media (max-width: 900px) { .page { grid-template-columns: 1fr; } nav { display: none; } .demo-body { flex-direction: column; } pre { flex: none; width: 100%; } }
  </style>
</head>
<body>
  <header>
    <h1>Teleplot JS: every feature of the library, live</h1>
    <button onclick="Teleplot.state.isPaused = !Teleplot.state.isPaused">Pause / Play</button>
    <button onclick="document.documentElement.dataset.theme = Teleplot.theme.isDark() ? 'light' : 'dark'">Light / Dark</button>
    <a href="test-performance.html">Performance test page</a>
  </header>
  <div class="page"><nav id="index"></nav><main id="main"></main></div>

  <script>
    initTeleplot();
    console.log("Teleplot loaded:", Teleplot);
    const P = Teleplot.protocol; // Protocol constants (data types, attributes...)

    // ------------------------------------------------------------------ The page: sections, an index, and cards
    // demo(title, what to look for, [width, height], build): a card with a live view and, next to it, the code that built it (the "build"
    // function itself, so the code shown is the code that runs). build gets the id of the element to draw in.
    // A size in pixels is exact (the view is given that box, whatever its own minimum height); with a width in % the height is a minimum.
    // data(title, note, send): a card for the code that produces the telemetries of a section (run once, shown folded).
    const main = document.getElementById("main"), index = document.getElementById("index");
    const add = (tag, props, parent) => parent.appendChild(Object.assign(document.createElement(tag), props));
    const px = (v) => typeof v == "number" ? v + "px" : v;
    let current, count = 0;
    function section(title, intro) {
      const id = "s-" + title.toLowerCase().replace(/[^a-z0-9]+/g, "-");
      current = add("section", { id }, main);
      add("h2", { textContent: title }, current);
      if (intro) add("p", { className: "intro", textContent: intro }, current);
      current.link = add("a", { href: "#" + id, textContent: title }, index);
      current.counter = add("span", {}, current.link); // Number of demos, written when there is one
      spy.observe(current);
    }
    function source(fn) { // Body of a function as written, without its first indentation
      const text = fn.toString();
      if (!text.includes("\n")) return text.replace(/^[^=]*=>\s*/, "");
      const lines = text.split("\n").slice(1, -1), indent = Math.min(...lines.filter((l) => l.trim()).map((l) => l.match(/^ */)[0].length));
      return lines.map((l) => l.slice(indent)).join("\n");
    }
    function card(title, note) {
      const article = add("article", { className: "demo" }, current);
      add("h3", { textContent: title }, article);
      if (note) add("p", { className: "note", textContent: note }, article);
      return article;
    }
    function demo(title, note, [width, height], build) {
      const body = add("div", { className: "demo-body" + (String(width).endsWith("%") ? " wide" : "") }, card(title, note));
      const exact = typeof width == "number" && typeof height == "number";
      const box = add("div", { className: "demo-view" + (exact ? " exact" : "") }, body);
      box.style.width = px(width); box.style[exact ? "height" : "minHeight"] = px(height);
      const view = add("div", { id: "demo-" + (++count) }, box);
      add("pre", { textContent: source(build) }, body);
      current.counter.textContent = Number(current.counter.textContent || 0) + 1;
      try { build(view.id); } catch (e) { console.error("Demo failed:", title, e); view.textContent = "This demo failed: " + e.message; }
    }
    function data(title, note, send) {
      const details = add("details", {}, card(title, note));
      add("summary", { textContent: "Code" }, details);
      add("pre", { textContent: source(send) }, details);
      send();
    }
    // The index shows which section is on screen
    const spy = new IntersectionObserver((entries) => entries.forEach((e) => e.target.link.classList.toggle("active", e.isIntersecting)), { rootMargin: "-50px 0px -60% 0px" });

    // ====================================================================================================================== Data
    section("Data", "The telemetries most demos display. Each section adds its own when it needs more. Everything goes through the public API: Teleplot.datastore, or the parsers Teleplot.parseDataText / Teleplot.parseDataBinary.");

    data("Numbers, text, 2D, 3D, images, a telemetry without data", "numberTelemetry and number.cos are updated 100 times per second, img1 changes every 2 seconds.", () => {
      const now = () => Date.now() / 1000;
      Teleplot.datastore.addTelemetry("text.Telemetry").addData(P.SECTION_TYPE_TELEM_DATA_TEXT, [now(), now() + 0.5, now() + 1], [["one", "two", "hello world, nice to meet you how are you"]]);
      Teleplot.datastore.addTelemetry(longName).addData(P.SECTION_TYPE_TELEM_DATA_NUMBER_2D, [now()], [[42], [43]]);
      Teleplot.datastore.addTelemetry("pose.3D").addData(P.SECTION_TYPE_TELEM_DATA_NUMBER_3D, [now()], [[1.23456], [-2.5], [1000]]);
      Teleplot.datastore.addTelemetry("empty.telemetry"); // Created, but no data yet
      const longUnit = Teleplot.datastore.addTelemetry("long.unit");
      longUnit.setAttribute(P.TELEM_ATTR_UNIT, "W/(m2.K) per square meter of surface");
      longUnit.addData(P.SECTION_TYPE_TELEM_DATA_NUMBER, [now()], [[12345.6789]]);

      // Images, through the text protocol
      Teleplot.parseDataText(`JPG|img1:${Date.now()}:1/1:${imgJpg}`);
      let imageCount = 0;
      setInterval(() => Teleplot.parseDataText(`${imageCount++ % 2 ? "JPG" : "PNG"}|img1:${Date.now()}:1/1:${imageCount % 2 ? imgPng : imgJpg}`), 2000);

      // One telemetry with several kinds of data (very specific, probably shouldn't be supported)
      const multi = Teleplot.datastore.addTelemetry("multi-channel-telemetry");
      multi.addData(P.SECTION_TYPE_TELEM_DATA_NUMBER, [now()], [[42]]);
      multi.addData(P.SECTION_TYPE_TELEM_DATA_TEXT, [now()], [["coucou"]]);
      Teleplot.parseDataText(`JPG|multi-channel-telemetry:${Date.now()}:1/1:${imgJpg}`);

      // Live numbers
      Teleplot.datastore.addTelemetry("numberTelemetry").addData(P.SECTION_TYPE_TELEM_DATA_NUMBER, [now()], [[42]]);
      Teleplot.datastore.addTelemetry("number.cos").addData(P.SECTION_TYPE_TELEM_DATA_NUMBER, [now()], [[42]]);
      Teleplot.datastore.getTelemetry("number.cos").setAttribute(P.TELEM_ATTR_DATA_TIMEOUT, 5.0); // Its own timeout: only 5 seconds are kept
      let updates = 0;
      setInterval(() => {
        Teleplot.datastore.getTelemetry("numberTelemetry").addData(P.SECTION_TYPE_TELEM_DATA_NUMBER, [now()], [[Math.sin(now()) * 100]]);
        Teleplot.datastore.getTelemetry("number.cos").addData(P.SECTION_TYPE_TELEM_DATA_NUMBER, [now()], [[Math.cos(now()) * 100]]);
        multi.addData(P.SECTION_TYPE_TELEM_DATA_NUMBER, [now()], [[updates++]]);
      }, 10);
    });

    demo("Memory: what the data takes, and making room", "The library estimates the room its data takes, per telemetry. When TELEPLOT.state.memoryLimit is reached it thins out the oldest data by itself (or forgets it, or pauses: memoryPolicy); the buttons do it by hand on numberTelemetry. Thinning keeps real samples (the lowest and highest of each group of 4), fewer of them: watch the chart on the right get a tinted \"thinned\" part.", [760, 220], (id) => {
      const box = document.getElementById(id);
      box.style.cssText += "display: grid; grid-template-columns: 320px 1fr; gap: 12px;";
      box.innerHTML = '<div><button>Thin out the oldest half</button> <button>Forget the oldest quarter</button> <button>Clear</button><pre style="margin-top: 8px; height: 150px"></pre></div><div id="' + id + '-chart"></div>';
      const [thin, forget, clear] = box.querySelectorAll("button"), out = box.querySelector("pre");
      const telem = Teleplot.datastore.getTelemetry("numberTelemetry");
      thin.onclick = () => telem.thinOldest(0.5);
      forget.onclick = () => telem.forgetOldest(0.25);
      clear.onclick = () => telem.clearData();
      Teleplot.view.addView(new Teleplot.view.ViewChart(id + "-chart", ["numberTelemetry"]));
      setInterval(() => {
        const usage = Teleplot.datastore.getMemoryUsage(), own = telem.getMemoryUsage(), span = Teleplot.datastore.getTimeSpan(); // (checkMemory() also runs once per second, in the update loop)
        out.textContent = `all the data: ${Math.round(usage.bytes / 1000)} kB, ${usage.samples} samples\nlimit: ${Teleplot.state.memoryLimit / 1e6} MB, policy: ${Teleplot.state.memoryPolicy}\nheaviest: ${usage.telemetries.slice(0, 3).map((t) => t.name).join(", ")}\ngoes back ${span ? Math.round(span.duration) : 0} s of the ${Teleplot.state.dataTimeout} s kept (${span ? span.name : "no data"})${span && span.thinned.length ? ", intact for the last " + Math.round(span.intact) + " s (thinned: " + span.thinned.join(", ") + ")" : ""}\n\nnumberTelemetry: ${Math.round(own.bytes / 1000)} kB, ${own.samples} samples`;
      }, 500);
    });

    data("Shapes with the binary protocol", "Packet builds binary packets (little-endian, see doc/binaryProtocol.md); binId(n) is the id the datastore gives to telemetry n of this client. One packet holds attributes and every kind of shape data.", () => {
      window.Packet = class Packet {
        constructor(clientId) { this.bytes = [P.BINARY_MARKER, P.BINARY_VERSION]; this.u16(clientId); }
        u8(v) { this.bytes.push(v & 0xff); return this; }
        u16(v) { return this.u8(v).u8(v >> 8); }
        u32(v) { return this.u16(v & 0xffff).u16(Math.floor(v / 65536)); }
        u64(v) { v = BigInt(v); return this.u32(Number(v & 0xffffffffn)).u32(Number(v >> 32n)); }
        f32(v) { this.bytes.push(...new Uint8Array(new Float32Array([v]).buffer)); return this; }
        str(s) { this.bytes.push(...new TextEncoder().encode(s), 0); return this; }
        section(type, telemId, write) { this.u8(type).u16(telemId).u64(BigInt(Date.now()) * 1000000n).u8(1).u32(0); write(this); return this; } // one sample, at the reference time
        send() { Teleplot.parseDataBinary(Uint8Array.from([...this.bytes, 0, 0]).buffer); }
      };
      window.CLIENT = 7;
      window.binId = (telemId) => CLIENT * 0x10000 + telemId;

      new Packet(CLIENT)
        .u8(P.SECTION_TYPE_CLIENT_NAME).str("3D demo (binary)")
        .u8(P.SECTION_TYPE_TELEM_ATTR).u16(1).u8(2).u8(P.TELEM_ATTR_NAME).str("bin3d.body").u8(P.TELEM_ATTR_SHAPE).u8(P.TELEM_ATTR_SHAPE_TYPE_CUBE)
        .u8(P.SECTION_TYPE_TELEM_ATTR).u16(2).u8(2).u8(P.TELEM_ATTR_NAME).str("bin3d.beacon").u8(P.TELEM_ATTR_SHAPE).u8(P.TELEM_ATTR_SHAPE_TYPE_SPHERE)
        .u8(P.SECTION_TYPE_TELEM_ATTR).u16(3).u8(2).u8(P.TELEM_ATTR_NAME).str("bin3d.mast").u8(P.TELEM_ATTR_SHAPE).u8(P.TELEM_ATTR_SHAPE_TYPE_CYLINDER)
        .u8(P.SECTION_TYPE_TELEM_ATTR).u16(4).u8(1).u8(P.TELEM_ATTR_NAME).str("bin3d.antenna.tip")
        .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_SIZE, 1, (p) => p.f32(0.8).f32(0.5).f32(0.3))
        .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_COLOR_STR, 1, (p) => p.str("#e67e22"))
        .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_SIZE, 2, (p) => p.f32(0.3).f32(0.3).f32(0.3))
        .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_SIZE, 3, (p) => p.f32(0.05).f32(0.05).f32(1))
        .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_3D_POSITION, 3, (p) => p.f32(0).f32(0).f32(0.5))
        .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_3D_ROTATION, 3, (p) => p.f32(0).f32(0.3).f32(0)) // roll, pitch, yaw: leans forward
        .send();
      setInterval(() => {
        const t = Date.now() / 1000, yaw = t / 2 + Math.PI / 2; // drives on a circle, facing where it goes
        const x = 1.5 * Math.cos(t / 2), y = 1.5 * Math.sin(t / 2);
        new Packet(CLIENT)
          .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_3D_POSITION, 1, (p) => p.f32(x).f32(y).f32(0.15))
          .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_3D_QUATERNION, 1, (p) => p.f32(Math.cos(yaw / 2)).f32(0).f32(0).f32(Math.sin(yaw / 2))) // w, x, y, z
          .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_3D_POSITION, 2, (p) => p.f32(0).f32(0).f32(1.15))
          .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_COLOR_RGB, 2, (p) => p.u8(255).u8(Math.round(127 + 127 * Math.sin(t * 3))).u8(0))
          .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_OPACITY, 2, (p) => p.u8(Math.round(155 + 100 * Math.sin(t * 3))))
          .section(P.SECTION_TYPE_TELEM_DATA_NUMBER_3D, 4, (p) => p.f32(x).f32(y).f32(0.5 + 0.2 * Math.sin(t * 4)))
          .send();
      }, 50);
    });

    demo("A shape with nothing but its kind", "3D|name:S:cube is enough: a cube of 1 at the origin, in the color of the telemetry. (The V1 widget label after the comma is ignored.)", [340, 200], (id) => {
      Teleplot.parseDataText("3D|only.shape,widget0:S:cube");
      Teleplot.view.addView(new Teleplot.view.ViewScene3D(id, ["only.shape"]));
    });

    // ====================================================================================================================== Images
    section("Images and cameras", "ViewImage: the pictures of an image telemetry, with 3D telemetries drawn over them as its camera saw them. The camera is described by intrinsics (and optionally lens distortion) in the usual image convention, and by a pose in the frame of the scene. Pictures are shown as received, never undistorted; nothing is interpolated: each picture is shown with the samples in effect when it was taken.");

    data("Two cameras turning around a cube", "The pictures are drawn here, point by point, with ViewImage.projectPoint (the camera model, lens distortion included): white lines for the edges of a cube and of a square on the ground. The views below draw the cube and the square themselves over the pictures: they must fit the white lines, whatever the cameras do. Camera 1 uses the text protocol (K, P, Q); camera 2 the binary protocol, with distortion.", () => {
      const S = Teleplot.view.ViewScene3D, V = Teleplot.view.ViewImage;
      Teleplot.parseDataText("3D|imgdemo.cube:S:cube:P:2:0:0.5:W:1:D:1:H:1:C:#e67e22");
      Teleplot.parseDataText("3D|imgdemo.ground:S:cube:P:2:0:-0.01:W:3:D:3:H:0.02:C:#3498db");
      setInterval(() => { const ms = Date.now(), t = ms / 500; Teleplot.parseDataText(`imgdemo.orbit:${(2 + Math.cos(t)).toFixed(3)}:${Math.sin(t).toFixed(3)}:1.2:${ms}|xyz`); }, 50);

      const box = (cx, cy, cz, sx, sy, sz) => { // the 12 edges of a box, as pairs of points
        const c = [];
        for (const dx of [-1, 1]) for (const dy of [-1, 1]) for (const dz of [-1, 1]) c.push([cx + dx * sx / 2, cy + dy * sy / 2, cz + dz * sz / 2]);
        const edges = [];
        for (let a = 0; a < 8; a++) for (let b = a + 1; b < 8; b++) if ([0, 1, 2].filter((k) => c[a][k] != c[b][k]).length == 1) edges.push([c[a], c[b]]);
        return edges;
      };
      const edges = box(2, 0, 0.5, 1, 1, 1).concat(box(2, 0, -0.01, 3, 3, 0.02));
      const toCamera = (camera, p) => { // world -> frame of the camera: rotation by the inverse of its quaternion
        const [w, x, y, z] = camera.quaternion, v = [p[0] - camera.position[0], p[1] - camera.position[1], p[2] - camera.position[2]];
        const q = [-x, -y, -z], t = [2 * (q[1] * v[2] - q[2] * v[1]), 2 * (q[2] * v[0] - q[0] * v[2]), 2 * (q[0] * v[1] - q[1] * v[0])];
        return [v[0] + w * t[0] + q[1] * t[2] - q[2] * t[1], v[1] + w * t[1] + q[2] * t[0] - q[0] * t[2], v[2] + w * t[2] + q[0] * t[1] - q[1] * t[0]];
      };
      const canvas = document.createElement("canvas"), g = canvas.getContext("2d");
      const picture = (camera, label) => { // base64 PNG of what the camera sees
        canvas.width = camera.width; canvas.height = camera.height;
        g.fillStyle = "#2c3e50"; g.fillRect(0, 0, camera.width, camera.height);
        g.strokeStyle = "white"; g.lineWidth = 1.5;
        for (const [a, b] of edges) {
          g.beginPath();
          let drawing = false;
          for (let i = 0; i <= 40; i++) { // many points per edge: a distorted edge is a curve
            const pixel = V.projectPoint(camera, toCamera(camera, [0, 1, 2].map((k) => a[k] + (b[k] - a[k]) * i / 40)));
            if (!pixel) { drawing = false; continue; }
            if (drawing) g.lineTo(pixel[0] + 0.5, pixel[1] + 0.5); else g.moveTo(pixel[0] + 0.5, pixel[1] + 0.5); // canvas coordinates start at the corner of the pixel
            drawing = true;
          }
          g.stroke();
        }
        g.fillStyle = "white"; g.font = "11px sans-serif"; g.fillText(label, 6, 14);
        return canvas.toDataURL("image/png").split(",")[1];
      };
      const pose = (t, radius, height) => { // turns around the cube, looking at it (the camera looks along its x), with a bit of roll
        const angle = t / 4, position = [2 + radius * Math.cos(angle), radius * Math.sin(angle), height];
        const yaw = Math.atan2(-position[1], 2 - position[0]), pitch = Math.atan2(height - 0.5, radius);
        return { position, quaternion: S.eulerToQuaternion(0.15 * Math.sin(t), pitch, yaw) };
      };

      const pinhole = { width: 320, height: 240, fx: 260, fy: 255, cx: 150.5, cy: 125.5, distortion: undefined };
      const wide = { width: 320, height: 240, fx: 170, fy: 170, cx: 159.5, cy: 119.5, distortion: [-0.32, 0.11, 0.004, -0.003, -0.012] };
      new Packet(CLIENT).u8(P.SECTION_TYPE_TELEM_ATTR).u16(20).u8(1).u8(P.TELEM_ATTR_NAME).str("imgdemo.camera.distorted").send();
      const shoot = () => {
        const ms = Date.now(), t = ms / 1000;
        // Camera 1, text protocol: the camera first (it is the one in effect when the picture comes), then the picture
        const a = Object.assign({}, pinhole, pose(t, 3.2, 1.6));
        const [w, x, y, z] = a.quaternion;
        Teleplot.parseDataText(`3D|imgdemo.camera.pinhole:${ms}:K:${a.fx}:${a.fy}:${a.cx}:${a.cy}:${a.width}:${a.height}:P:${a.position.join(":")}:Q:${x}:${y}:${z}:${w}:W:0.6`);
        Teleplot.parseDataText(`PNG|imgdemo.camera.pinhole:${ms}:${picture(a, "pinhole, text protocol")}`);

        // Camera 2, binary protocol. It carries float32: the picture is drawn with the values the viewer will get
        const b = Object.assign({}, wide, pose(-t * 0.7, 2.4, 1.1));
        b.position = Array.from(new Float32Array(b.position)); b.quaternion = Array.from(new Float32Array(b.quaternion)); b.distortion = Array.from(new Float32Array(b.distortion));
        const bytes = Uint8Array.from(atob(picture(b, "wide angle with distortion, binary protocol")), (c) => c.charCodeAt(0));
        new Packet(CLIENT)
          .section(P.SECTION_TYPE_TELEM_DATA_CAMERA_INTRINSICS, 20, (p) => p.u16(b.width).u16(b.height).f32(b.fx).f32(b.fy).f32(b.cx).f32(b.cy))
          .section(P.SECTION_TYPE_TELEM_DATA_CAMERA_DISTORTION, 20, (p) => b.distortion.forEach((v) => p.f32(v)))
          .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_3D_POSITION, 20, (p) => b.position.forEach((v) => p.f32(v)))
          .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_3D_QUATERNION, 20, (p) => b.quaternion.forEach((v) => p.f32(v)))
          .section(P.SECTION_TYPE_TELEM_DATA_SHAPE_SIZE, 20, (p) => p.f32(0.6).f32(1).f32(1)) // x: how far the camera is drawn in 3D views
          .section(P.SECTION_TYPE_TELEM_DATA_IMAGE, 20, (p) => { p.u8(P.IMAGE_TYPE_PNG).u16(0).u16(1).u16(bytes.length); p.bytes.push(...bytes); }) // part 0 of 1
          .send();
      };
      shoot();
      setInterval(shoot, 200);
    });
    demo("Pinhole camera, whole objects", "outline off. The orange cube and the blue ground must stay on the white lines of the picture.", [480, 360], (id) => {
      const view = new Teleplot.view.ViewImage(id, ["imgdemo.camera.pinhole", "imgdemo.cube", "imgdemo.ground"]); // the first image telemetry is the picture
      view.setOption("outline", false);
      Teleplot.view.addView(view);
    });
    demo("Lens distortion, whole objects", "What is drawn over the picture is bent like the lens does (straight edges become curves); the picture is untouched.", [480, 360], (id) => {
      const view = new Teleplot.view.ViewImage(id, [binId(20), "imgdemo.cube", "imgdemo.ground"]);
      view.setOption("outline", false);
      Teleplot.view.addView(view);
    });
    demo("Outlines (the default)", "Only a line where an object ends or meets an object of another color: the picture stays visible inside. outlineWidth 3 (the default). Also a 3D point with its trail.", [340, 280], (id) => {
      const view = new Teleplot.view.ViewImage(id, ["imgdemo.camera.pinhole", "imgdemo.cube", "imgdemo.ground", "imgdemo.orbit"]);
      view.setOption("overlayOpacity", 100);
      Teleplot.view.addView(view);
    });
    demo("Outlines with lens distortion", "outlineWidth 8.", [340, 280], (id) => {
      const view = new Teleplot.view.ViewImage(id, [binId(20), "imgdemo.cube", "imgdemo.ground", "imgdemo.orbit"]);
      view.setOption("outlineWidth", 8); view.setOption("overlayOpacity", 100);
      Teleplot.view.addView(view);
    });
    demo("Other options", "outline off, overlayOpacity 100 (the objects hide the picture), no legend, a title.", [340, 280], (id) => {
      const view = new Teleplot.view.ViewImage(id, ["imgdemo.camera.pinhole", "imgdemo.cube", "imgdemo.orbit"]);
      view.setOption("outline", false); view.setOption("overlayOpacity", 100); view.setOption("displayLegend", false);
      view.setOption("title", "Opaque");
      Teleplot.view.addView(view);
    });
    demo("The two cameras in a 3D scene", "Each one is the pyramid of what it sees; its size along x is how far it is drawn.", [480, 360], (id) => {
      Teleplot.view.addView(new Teleplot.view.ViewScene3D(id, ["imgdemo.cube", "imgdemo.ground", "imgdemo.camera.pinhole", binId(20)]));
    });
    demo("No camera parameters", "img1 has no intrinsics: the picture alone, and a note because a shape is asked over it.", [340, 280], (id) => {
      Teleplot.view.addView(new Teleplot.view.ViewImage(id, ["img1", "imgdemo.cube"]));
    });
    demo("A picture alone", "No WebGL canvas is created when there is nothing to draw over the picture.", [340, 280], (id) => {
      Teleplot.view.addView(new Teleplot.view.ViewImage(id, ["img1"]));
    });
    demo("Nothing to display", "Shapes, but no image.", [340, 200], (id) => {
      Teleplot.view.addView(new Teleplot.view.ViewImage(id, ["imgdemo.cube"]));
    });

    // ====================================================================================================================== Sources
    section("Sources", "Where the data comes from: connections to a Teleplot server (UDP relayed through a WebSocket) and serial ports opened by the browser itself (Web Serial). Each connection counts what it receives, and the telemetries know which one sent them. See doc/sources.md.");

    demo("Serial port, read by the browser", "Needs Chrome, Edge or Opera and a device (or the simulated one). Lines starting with > are telemetry (>temp:24.5), the others are log lines of the port; every line is also kept in a console. The box below is that console and what the connection counts; the telemetries show up in the automatic dashboard at the bottom of the page.", [520, 260], (id) => {
      const box = document.getElementById(id);
      box.innerHTML = '<button>Choose a serial port…</button> <button>Simulated device</button> <button>Send "ping"</button><pre style="height: 200px; margin-top: 8px"></pre>';
      const [choose, simulate, send] = box.querySelectorAll("button"), out = box.querySelector("pre");
      let connection;
      choose.disabled = !Teleplot.connection.serialSupported(); // Web Serial is not in every browser
      choose.onclick = async () => { connection = await Teleplot.connection.requestSerialPort(115200) || connection; }; // the browser asks which port
      simulate.onclick = () => { // a fake port: what the library needs from one (open, close, getInfo, two streams)
        let feed;
        const port = { getInfo: () => ({}), close: async () => clearInterval(feed), open: async () => {
          port.readable = new ReadableStream({ start(c) { feed = setInterval(() => c.enqueue(new TextEncoder().encode(`>serial.demo:${Math.sin(Date.now() / 500).toFixed(3)}\nstill alive\n>broken line\n`)), 500); } });
          port.writable = new WritableStream({ write() {} });
        } };
        connection = Teleplot.connection.addConnectionSerial(port, 115200);
      };
      send.onclick = () => connection && connection.send("ping", "\n");
      setInterval(() => {
        if (!connection) return;
        const lines = connection.console.lines.slice(-9).map((l) => (l.sent ? "← " : "") + l.text + (l.problem ? "   (not understood)" : ""));
        out.textContent = `${connection.name}: ${connection.connected ? "connected" : (connection.error || "closed")}, ${connection.stats.messages} lines, ${connection.stats.problems} not understood\n\n` + lines.join("\n");
      }, 250);
    });
    demo("Connection to a Teleplot server", "Start packages/server (node main.js) to see it connect; it is tried again every 2 seconds until then. Send a line to UDP port 47269 (see the Help of the webapp) and it shows up here and in the automatic dashboard.", [520, 110], (id) => {
      const connection = Teleplot.connection.addConnectionTeleplotServer("127.0.0.1", 8080);
      const out = document.getElementById(id).appendChild(document.createElement("pre"));
      setInterval(() => {
        const state = connection.connected ? "connected" : (connection.everConnected ? "connection lost" : "cannot be reached") + ", next try in " + Math.max(0, Math.ceil((connection.nextRetryAt - Date.now()) / 1000)) + " s";
        const mine = Object.values(Teleplot.datastore.telemetries).filter((t) => t.sourceId === connection.id).length;
        out.textContent = `${connection.name}: ${state}\n${connection.stats.messages} messages, ${connection.stats.problems} not understood, ${mine} telemetries from it`;
      }, 250);
    });

    // ====================================================================================================================== Dashboards
    section("Dashboards", "A dashboard is a named layout. The automatic one displays new telemetries without any setup: numbers get a chart, shapes and 3D points share one 3D scene, images get an image view, the rest a values view.");

    demo("Automatic dashboard", "Only telemetries created after enableAutoDashboard() are displayed. auto.sin and auto.text have no label: a view each. auto.left, auto.right and auto.state have the view label \"motors\" (name,label in the text protocol): the two numbers share a chart titled with the label, the text gets the values view of the label. The library does not decide where a dashboard goes on the page: the callback puts it in this card.", ["100%", "auto"], (id) => {
      Teleplot.dashboards.enableAutoDashboard("Auto demo", (dashboard) => {
        const element = document.createElement("div");
        element.id = dashboard.getView().divId;
        document.getElementById(id).appendChild(element);
      });
      setInterval(() => {
        const now = Date.now() / 1000;
        Teleplot.datastore.getOrCreateTelemetry("auto.sin").addData(P.SECTION_TYPE_TELEM_DATA_NUMBER, [now], [[Math.sin(now)]]);
        Teleplot.datastore.getOrCreateTelemetry("auto.text").addData(P.SECTION_TYPE_TELEM_DATA_TEXT, [now], [["auto " + Math.floor(now % 10)]]);
        Teleplot.parseDataText(`auto.left,motors:${Math.sin(now * 2).toFixed(3)}\nauto.right,motors:${Math.cos(now * 2).toFixed(3)}\nauto.state,motors:${Math.sin(now * 2) > 0 ? "forward" : "backward"}|t`);
      }, 50);
    });
  </script>
</body>
