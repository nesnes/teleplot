<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teleplot</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="libs/icofont/icofont.min.css"> <!-- https://icofont.com/ -->
  <script src="libs/teleplot-js.js"></script>
</head>
<body>
  <div id="app">

    <!-- Content -->

    <div class="panel-container" @transitionrun="motion($event, 1)" @transitionend="motion($event, -1)" @transitioncancel="motion($event, -1)">
      <!-- Left dock: opens and closes by sliding its space, the dashboard follows without jumping. The panel stays displayed until the dock is closed. -->
      <div class="dock dock-left" :class="{open: !!ctx.sidePanel}">
        <transition name="dock-swap" mode="out-in">
          <div v-if="shownPanel=='telemetries'" key="telemetries" class="side-panel">
            <div class="panel-title">
              <button class="panel-close" title="Close (Esc)" aria-label="Close panel" @click="ctx.sidePanel='';"><i class="icofont-close"></i></button>
              <h1>Telemetries</h1>
              <span>Drag telemetries on a dashboard to display them.</span>
            </div>
            <panel-telemetries></panel-telemetries>
          </div>
          <div v-else-if="shownPanel=='sources'" key="sources" class="side-panel">
            <div class="panel-title">
              <button class="panel-close" title="Close (Esc)" aria-label="Close panel" @click="ctx.sidePanel='';"><i class="icofont-close"></i></button>
              <h1>Sources</h1>
              <span>Is the data arriving, and where does it come from.</span>
            </div>
            <panel-sources></panel-sources>
          </div>
        </transition>
      </div>

      <!-- Workspace: scrolls on its own; the top menu floats above the dashboard (it fades out when the mouse rests, see top-menu.js) -->
      <div class="workspace">
        <top-menu></top-menu>
        <div class="main-panel">
          <template v-if="Object.entries(TP.dashboards.dashboards).length">
            <template v-for="dashboard in TP.dashboards.dashboards" :key="dashboard.name">
              <dashboard v-if="dashboard === ctx.activeDashboard" :dashboard="dashboard"></dashboard>
            </template>
          </template>
          <welcome v-else-if="ctx.showHelp"></welcome>
        </div>
      </div>

      <!-- Help dock, on the right: it can stay open next to the Telemetries or Sources panel (try a message, watch it arrive) -->
      <div class="dock dock-right dock-help dock-help-wide" :class="{open: ctx.helpOpen}">
        <div v-if="shownHelp" class="side-panel side-panel-right">
          <div class="panel-title">
            <button class="panel-close" title="Close (Esc)" aria-label="Close panel" @click="ctx.helpOpen = false;"><i class="icofont-close"></i></button>
            <h1>Help</h1>
            <span>What do you want to see?</span>
          </div>
          <panel-help></panel-help>
        </div>
      </div>

      <!-- Export and import, on the right too (in place of Help: one of the two at a time), next to the Telemetries or Sources panel -->
      <div class="dock dock-right dock-help" :class="{open: ctx.exportOpen}">
        <div v-if="shownExport" class="side-panel side-panel-right">
          <div class="panel-title">
            <button class="panel-close" title="Close (Esc)" aria-label="Close panel" @click="ctx.exportOpen = false;"><i class="icofont-close"></i></button>
            <h1>Export and import</h1>
            <span>Save your data to a file, open a file.</span>
          </div>
          <panel-export></panel-export>
        </div>
      </div>

      <!-- Right dock: the edit panel follows the selection made on the dashboard -->
      <div class="dock dock-right" :class="{open: editor.state.enabled}">
        <panel-edit></panel-edit>
      </div>
    </div>

  </div>
</body>

<script>
</script>
<script src="./libs/vue.js"></script>
<script src="./components/sample-robot.js"></script>
<script src="./components/telemetry-rate.js"></script>
<script src="./components/top-menu.js"></script>
<script src="./components/sample-controls.js"></script>
<script src="./components/welcome.js"></script>
<script src="./components/panel-help.js"></script>
<script src="./components/panel-sources.js"></script>
<script src="./components/panel-telemetries.js"></script>
<script src="./components/panel-export.js"></script>
<script src="./components/dashboard-editor.js"></script>
<script src="./components/panel-edit.js"></script>
<script src="./components/dashboard.js"></script>
<script src="./main.js"></script>
</html>
