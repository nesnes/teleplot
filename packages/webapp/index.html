<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teleplot</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="libs/icofont/icofont.min.css"> <!-- https://icofont.com/ -->
  <script src="libs/teleplot-js.js"></script>
</head>
<body>
  <div id="app">

    <!-- Content -->

    <div class="top-menu">
      <div class="top-menu-section">
        <img src="media/logo-color.svg" class="top-menu-logo"/>
        
        <div class="top-menu-anchor">
          <button class="top-menu-item" :class="{active: ctx.topPanel=='dashboard'}" :aria-expanded="ctx.topPanel=='dashboard'" aria-haspopup="menu" @click="setTopPanel('dashboard');">
            <i class="icofont-dashboard"></i>
            <span v-if="ctx.activeDashboard" class="top-menu-item-upper-text">Dashboard</span>
            <span>{{ctx.activeDashboard ? ctx.activeDashboard.name : 'Dashboard'}}</span>
            <i class="icofont-simple-down top-menu-caret"></i>
          </button>
          <template v-if="ctx.topPanel=='dashboard'">
            <div class="dashboard-dropdown-backdrop" @click="setTopPanel('');"></div>
            <div class="dashboard-dropdown" role="menu">
              <template v-for="dashboard in dashboardList()" :key="dashboard.name">
                <div class="dashboard-dropdown-row" :class="{current: dashboard === ctx.activeDashboard}">
                  <button class="dashboard-dropdown-main" role="menuitem" @click="selectDashboard(dashboard);">
                    <span class="dashboard-dropdown-name">
                      <span><span v-if="dashboard.isAuto" class="dashboard-dropdown-live"></span>{{dashboard.name}}</span>
                      <span class="dashboard-dropdown-sub">{{dashboardSummary(dashboard)}}</span>
                    </span>
                    <i v-if="dashboard === ctx.activeDashboard" class="icofont-check dashboard-dropdown-check"></i>
                  </button>
                  <button class="dashboard-dropdown-edit" title="Edit dashboard" aria-label="Edit dashboard" @click="editDashboard(dashboard);">
                    <i class="icofont-duotone icofont-pencil"></i>
                  </button>
                </div>
                <div v-if="dashboard.isAuto" class="dashboard-dropdown-sep"></div>
              </template>
              <div v-if="!dashboardList().length" class="dashboard-dropdown-empty">No dashboard yet. Send some data, or create one.</div>
              <div class="dashboard-dropdown-sep"></div>
              <button class="dashboard-dropdown-new" role="menuitem" @click="newDashboard();">
                <i class="icofont-plus"></i> New dashboard
              </button>
            </div>
          </template>
        </div>
        <button class="top-menu-item" :class="{active: ctx.sidePanel=='telemetries'}" :aria-pressed="ctx.sidePanel=='telemetries'" @click="toggleSidePanel('telemetries');">
          <i class="icofont-duotone icofont-chart"></i>
          <span>Telemetries</span>
        </button>
        <button class="top-menu-item" :class="{active: ctx.sidePanel=='sources'}" :aria-pressed="ctx.sidePanel=='sources'" @click="toggleSidePanel('sources');">
          <i class="icofont-link"></i>
          <span>Sources</span>
        </button>
        <button class="top-menu-item" :class="{active: ctx.sidePanel=='export'}" :aria-pressed="ctx.sidePanel=='export'" @click="toggleSidePanel('export');">
          <i class="icofont-share-alt"></i>
          <span>Export</span>
        </button>
        <button class="top-menu-item" :class="{active: ctx.sidePanel=='help'}" :aria-pressed="ctx.sidePanel=='help'" @click="toggleSidePanel('help');">
          <i class="icofont-info"></i>
          <span class="top-menu-item-name">Help</span>
        </button>
      </div>

      <div class="top-menu-section">
      </div>
      
      <div class="top-menu-section">
        <button class="top-menu-item" :class="{active: editor.state.enabled}" :aria-pressed="editor.state.enabled" :disabled="!ctx.activeDashboard" title="Edit the dashboard" @click="toggleEdit();">
          <i class="icofont-duotone icofont-pencil"></i>
          <span>Edit</span>
        </button>
      </div>
    </div>

    <div class="panel-container">
      <!-- Sources -->
      <div v-if="ctx.sidePanel=='sources'" class="side-panel">
        <div class="panel-title">
          <button class="panel-close" title="Close (Esc)" aria-label="Close panel" @click="ctx.sidePanel='';"><i class="icofont-close"></i></button>
          <h1>Sources</h1>
          <span>List of <b>Connections</b> and <b>static-files</b> feeding this Teleplot session.</span>
        </div>
        <panel-sources/>
      </div>
      <!-- Telemetries -->
      <div v-if="ctx.sidePanel=='telemetries'" class="side-panel">
        <div class="panel-title">
          <button class="panel-close" title="Close (Esc)" aria-label="Close panel" @click="ctx.sidePanel='';"><i class="icofont-close"></i></button>
          <h1>Telemetries</h1>
          <span>Drag telemetries on a dashboard to display them.</span>
        </div>
        <panel-telemetries/>
      </div>

      <div v-if="ctx.sidePanel=='help'" class="side-panel">
        <div class="panel-title">
          <button class="panel-close" title="Close (Esc)" aria-label="Close panel" @click="ctx.sidePanel='';"><i class="icofont-close"></i></button>
          <h1>Help</h1>
          <span>Please help.</span>
        </div>
        <panel-help/>
      </div>

      <div class="main-panel">

        <template v-if="Object.entries(TP.dashboards.dashboards).length">
          <template v-for="dashboard in TP.dashboards.dashboards" :key="dashboard.name">
            <dashboard v-if="dashboard === ctx.activeDashboard" :dashboard="dashboard"/>
          </template>
        </template>
        <div v-else-if="ctx.showHelp" class="help-panel">
          <img src="./media/logo-color.svg" class="help-logo"/>
          <panel-help/>
        </div>

      </div>

      <!-- Edit panel: follows the selection made on the dashboard -->
      <panel-edit v-if="editor.state.enabled"/>
    </div>

  </div>
</body>

<script>
</script>
<script src="./libs/vue.js"></script>
<script src="./components/sample-robot.js"></script>
<script src="./components/panel-help.js"></script>
<script src="./components/panel-sources.js"></script>
<script src="./components/panel-telemetries.js"></script>
<script src="./components/dashboard-editor.js"></script>
<script src="./components/panel-edit.js"></script>
<script src="./components/dashboard.js"></script>
<script src="./main.js"></script>
</html>
