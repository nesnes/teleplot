<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teleplot</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="libs/icofont/icofont.min.css"> <!-- https://icofont.com/ -->
  <script src="libs/teleplot-js.js"></script>
</head>
<body>
  <div id="app">

    <!-- Content -->

    <div class="top-menu">
      <div class="top-menu-section">
        <img src="media/logo-color.svg" class="top-menu-logo"/>
        
        <button class="top-menu-item" :class="{active: ctx.topPanel=='dashboard' || ctx.sidePanel=='dashboard'}" :aria-pressed="ctx.topPanel=='dashboard'" @click="setTopPanel('dashboard');">
          <i class="icofont-dashboard"></i>
          <span v-if="ctx.activeDashboard" class="top-menu-item-upper-text">Dashboard</span>
          <span>{{ctx.activeDashboard ? ctx.activeDashboard.name : 'Dashboard'}}</span>
        </button>
        <button class="top-menu-item" :class="{active: ctx.sidePanel=='telemetries'}" :aria-pressed="ctx.sidePanel=='telemetries'" @click="toggleSidePanel('telemetries');">
          <i class="icofont-duotone icofont-chart"></i>
          <span>Telemetries</span>
        </button>
        <button class="top-menu-item" :class="{active: ctx.sidePanel=='sources'}" :aria-pressed="ctx.sidePanel=='sources'" @click="toggleSidePanel('sources');">
          <i class="icofont-link"></i>
          <span>Sources</span>
        </button>
        <button class="top-menu-item" :class="{active: ctx.sidePanel=='export'}" :aria-pressed="ctx.sidePanel=='export'" @click="toggleSidePanel('export');">
          <i class="icofont-share-alt"></i>
          <span>Export</span>
        </button>
        <button class="top-menu-item" :class="{active: ctx.sidePanel=='help'}" :aria-pressed="ctx.sidePanel=='help'" @click="toggleSidePanel('help');">
          <i class="icofont-info"></i>
          <span class="top-menu-item-name">Help</span>
        </button>
      </div>

      <div class="top-menu-section">
      </div>
      
      <div class="top-menu-section">

      </div>
    </div>

    <div class="top-panel" v-if="ctx.topPanel=='dashboard'">
      <div class="top-panel-dashboard-list">
        <div v-for="dashboard in TP.dashboards.dashboards" :key="dashboard.name"
          class="top-panel-dashboard-card" @click="ctx.activeDashboard=dashboard; setTopPanel('');">
          <span class="">{{dashboard.name}}</span>
          <div class="top-panel-dashboard-card-edit" @click.stop="ctx.activeDashboard=dashboard; ctx.sidePanel='dashboard'; setTopPanel('');">
            <i class="icofont-duotone icofont-pencil"></i>
          </div>
        </div>
      </div>
    </div>
    
    <div class="panel-container">
      <!-- Sources -->
      <div v-if="ctx.sidePanel=='sources'" class="side-panel">
        <div class="panel-title">
          <button class="panel-close" title="Close (Esc)" aria-label="Close panel" @click="ctx.sidePanel='';"><i class="icofont-close"></i></button>
          <h1>Sources</h1>
          <span>List of <b>Connections</b> and <b>static-files</b> feeding this Teleplot session.</span>
        </div>
        <panel-sources/>
      </div>
      <!-- Telemetries -->
      <div v-if="ctx.sidePanel=='telemetries'" class="side-panel">
        <div class="panel-title">
          <button class="panel-close" title="Close (Esc)" aria-label="Close panel" @click="ctx.sidePanel='';"><i class="icofont-close"></i></button>
          <h1>Telemetries</h1>
          <span>Drag telemetries on a dashboard to display them.</span>
        </div>
        <panel-telemetries/>
      </div>

      <div v-if="ctx.sidePanel=='help'" class="side-panel">
        <div class="panel-title">
          <button class="panel-close" title="Close (Esc)" aria-label="Close panel" @click="ctx.sidePanel='';"><i class="icofont-close"></i></button>
          <h1>Help</h1>
          <span>Please help.</span>
        </div>
        <panel-help/>
      </div>

      <div v-if="ctx.sidePanel=='dashboard' && ctx.activeDashboard" class="side-panel">
        <div class="panel-title">
          <button class="panel-close" title="Close (Esc)" aria-label="Close panel" @click="ctx.sidePanel='';"><i class="icofont-close"></i></button>
        </div>
        <panel-dashboard/>
      </div>

      <div class="main-panel">

        <template v-if="Object.entries(TP.dashboards.dashboards).length">
          <template v-for="dashboard in TP.dashboards.dashboards" :key="dashboard.name">
            <dashboard v-if="dashboard === ctx.activeDashboard" :dashboard="dashboard"/>
          </template>
        </template>
        <div v-else-if="ctx.showHelp" class="help-panel">
          <img src="./media/logo-color.svg" class="help-logo"/>
          <panel-help/>
        </div>

      </div>
    </div>

  </div>
</body>

<script>
</script>
<script src="./libs/vue.js"></script>
<script src="./components/sample-robot.js"></script>
<script src="./components/panel-help.js"></script>
<script src="./components/panel-sources.js"></script>
<script src="./components/panel-telemetries.js"></script>
<script src="./components/panel-dashboard.js"></script>
<script src="./components/dashboard.js"></script>
<script src="./main.js"></script>
</html>
